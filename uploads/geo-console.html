<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>aisee · GEO 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gotu&family=Karla:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   aisee · GEO 控制台 — Design Tokens
   闭环引擎：诊断 → 排程 → 执行 → 复扫，围绕一个分数
   ============================================================ */
:root{
  /* 背景 */
  --bg-app:#F4F5F2; --bg-card:#FFFFFF; --bg-subtle:#FAFAFA; --bg-muted:#F0F0F0;
  /* 灰阶 */
  --g-200:#eaeaea; --g-300:#e5e6ec; --g-400:#d1d6e0; --g-500:#9dabb7; --g-700:#6b7280; --g-900:#3d3d3a;
  /* 文字 */
  --ink:#111111; --text-2:#3d3d3a; --text-3:#6b7280; --inverse:#FFFFFF;
  /* 边框 */
  --border-subtle:#eaeaea; --border:#e5e6ec; --border-input:#d1d6e0;
  /* 功能色 */
  --success:#22C55E; --warning:#F59E0B; --error:#ec5212; --error-pale:#fdebe4;
  /* 模块身份色 —— 闭环四态各有主色 */
  --analysis:#CFFF29;            /* 诊断 · Analysis 荧光绿 */
  --analysis-deep:#92bc01;
  --plan:#111111;                /* 排程 · 任务中心 墨色（指挥） */
  --post:#F5D000;                /* 执行 · Post 琥珀黄 */
  --engage:#7C5CFC;              /* 执行 · Engage 紫 */
  --rescan:#48D7FD;             /* 复扫 · 回到 Analysis 的扫描态（仅此处用青，做"流动/扫描"语义）*/
  /* 分数刻度色（红→琥珀→青柠→品牌）*/
  --score-low:#ec5212; --score-mid:#F5A623; --score-high:#9ED600; --score-top:#CFFF29;
  /* 圆角 */
  --r-sm:6px; --r-md:8px; --r:10px; --r-lg:14px; --r-xl:20px; --r-pill:999px;
  /* 阴影 */
  --shadow-card:0 1px 2px rgba(17,17,17,.04), 0 12px 32px -16px rgba(17,17,17,.12);
  --shadow-menu:0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -4px rgba(0,0,0,.10);
  --shadow-pop:0 18px 40px -12px rgba(17,17,17,.22);
  /* 间距 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  /* 字体 */
  --font-display:"Gotu","Space Grotesk",system-ui,sans-serif;
  --font-body:"Karla","Inter",system-ui,-apple-system,sans-serif;
  --font-mono:"Share Tech Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body); color:var(--ink); background:var(--bg-app);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
.lcd{font-family:var(--font-mono); font-feature-settings:"tnum"; letter-spacing:.01em}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
::selection{background:var(--analysis); color:var(--ink)}

/* ---------- App Shell ---------- */
.app{display:grid; grid-template-columns:212px 1fr 332px; grid-template-rows:60px 1fr; height:100vh;}
.topbar{grid-column:1/-1; display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--s6); border-bottom:1px solid var(--border-subtle); background:rgba(255,255,255,.72);
  backdrop-filter:saturate(120%);}
.brandmark{display:flex; align-items:center; gap:10px;}
.brandmark .logo{width:26px; height:26px; border-radius:var(--r-md); background:var(--analysis);
  display:grid; place-items:center; box-shadow:0 0 0 6px rgba(207,255,41,.18);}
.brandmark .logo i{width:9px; height:9px; border-radius:50%; background:var(--ink); display:block}
.brandmark b{font-family:var(--font-display); font-size:19px; letter-spacing:.2px}
.brandmark span{color:var(--text-3); font-size:13px; font-weight:500}
.topbar .right{display:flex; align-items:center; gap:var(--s4)}
.plan-pill{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-2);
  background:var(--bg-muted); padding:7px 12px; border-radius:var(--r-pill); font-weight:500}
.plan-pill b{font-family:var(--font-mono); color:var(--ink)}
.btn-rescan{display:flex; align-items:center; gap:7px; background:var(--ink); color:#fff;
  font-weight:600; font-size:13px; padding:9px 16px; border-radius:var(--r-pill);
  transition:transform .15s ease, background .15s ease;}
.btn-rescan:hover{transform:translateY(-1px); background:#000}
.btn-rescan:active{transform:scale(.98)}
.btn-rescan svg{transition:transform .6s ease}
.btn-rescan.spin svg{transform:rotate(360deg)}

/* ---------- 左：项目切换 ---------- */
.rail{border-right:1px solid var(--border-subtle); padding:var(--s5) var(--s3); display:flex; flex-direction:column; gap:var(--s2); overflow-y:auto; background:var(--bg-card)}
.rail .new{display:flex; align-items:center; justify-content:center; gap:6px; font-weight:600; font-size:13px;
  background:var(--analysis); color:var(--ink); padding:10px; border-radius:var(--r-md); margin-bottom:var(--s3);
  transition:background .15s, transform .15s}
.rail .new:hover{background:var(--analysis-deep)}
.rail .new:active{transform:scale(.98)}
.rail h6{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-3); font-weight:700; padding:0 8px var(--s2)}
.proj{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--r-md); cursor:pointer;
  transition:background .14s ease; position:relative}
.proj:hover{background:var(--bg-muted)}
.proj.active{background:var(--bg-muted)}
.proj.active::before{content:""; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--ink)}
.proj .ava{width:26px; height:26px; border-radius:7px; flex:0 0 auto; display:grid; place-items:center; font-weight:700; font-size:12px; color:#fff}
.proj .meta{flex:1; min-width:0}
.proj .nm{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.proj .bar{height:3px; border-radius:2px; background:var(--g-200); margin-top:5px; overflow:hidden}
.proj .bar i{display:block; height:100%; border-radius:2px; transition:width .5s ease}
.proj .sc{font-family:var(--font-mono); font-size:12.5px; color:var(--text-2); font-weight:500}

/* ---------- 中：闭环驾驶舱 ---------- */
.stage{position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center;
  padding:var(--s5) var(--s6) 0;}
/* 极淡的分数色径向光，随分数变 */
.stage::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 80% at 50% 22%, var(--halo,rgba(207,255,41,.14)) 0%, transparent 55%);
  transition:background .8s ease}
.loopwrap{position:relative; width:430px; height:430px; margin-top:2px;}
.loopwrap svg.ring{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
.center-readout{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center}
.center-readout .kick{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-3); font-weight:700}
.center-readout .score{font-family:var(--font-mono); font-size:62px; line-height:1; letter-spacing:-.01em; font-weight:400}
.center-readout .target{font-size:13px; color:var(--text-3); font-weight:500}
.center-readout .target b{font-family:var(--font-mono); color:var(--ink)}
.center-readout .pname{font-family:var(--font-display); font-size:17px; margin-top:6px}

/* 闭环节点 */
.node{position:absolute; width:88px; transform:translate(-50%,-50%); text-align:center; cursor:pointer; z-index:3}
.node .dot{width:38px; height:38px; border-radius:12px; margin:0 auto 6px; display:grid; place-items:center;
  background:var(--bg-card); border:1px solid var(--border); box-shadow:var(--shadow-card);
  transition:transform .2s ease, box-shadow .2s ease;}
.node .dot i{width:13px; height:13px; border-radius:4px; display:block}
.node:hover .dot{transform:translateY(-2px)}
.node .lab{font-size:11.5px; font-weight:700; color:var(--text-2)}
.node .sub{font-size:10px; color:var(--text-3); font-weight:500}
.node.sel .dot{border-color:var(--ink); transform:scale(1.06)}
.node.live .dot{animation:nodepulse 1.8s ease-out infinite}
@keyframes nodepulse{0%{box-shadow:0 0 0 0 var(--ring,rgba(207,255,41,.55))}100%{box-shadow:0 0 0 14px rgba(207,255,41,0)}}

/* 流动彗星 */
.comet{position:absolute; width:9px; height:9px; border-radius:50%; left:50%; top:50%; margin:-4.5px; z-index:2;
  background:var(--rescan); box-shadow:0 0 10px 2px var(--rescan); offset-rotate:0deg;}

/* 关键一步卡片 */
.nextstep{width:520px; margin-top:6px; background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--r-xl); box-shadow:var(--shadow-card); padding:18px 20px; position:relative; z-index:4;
  transition:transform .3s ease, box-shadow .3s ease}
.nextstep .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.nextstep .head .t{display:flex; align-items:center; gap:9px}
.nextstep .head .t .pp{width:8px; height:8px; border-radius:50%; background:var(--analysis-deep); position:relative}
.nextstep .head .t .pp::after{content:""; position:absolute; inset:0; border-radius:50%; background:var(--analysis-deep); animation:ppulse 1.6s ease-out infinite}
@keyframes ppulse{0%{box-shadow:0 0 0 0 rgba(146,188,1,.5)}100%{box-shadow:0 0 0 9px rgba(146,188,1,0)}}
.nextstep .head .t b{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-3); font-weight:700}
.nextstep .head .gain{font-family:var(--font-mono); font-size:13px; font-weight:500; color:var(--analysis-deep);
  background:var(--analysis); padding:4px 10px; border-radius:var(--r-pill); color:var(--ink)}
.task-row{display:flex; align-items:center; gap:12px}
.task-row .chip{width:34px; height:34px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center; font-weight:700; font-size:12px; color:#fff}
.task-row .body{flex:1; min-width:0}
.task-row .ttl{font-size:15px; font-weight:600; line-height:1.25}
.task-row .src{display:inline-flex; align-items:center; gap:5px; margin-top:5px; font-size:11.5px; color:var(--text-3); font-weight:500}
.task-row .src code{font-family:var(--font-mono); background:var(--bg-muted); padding:1px 6px; border-radius:var(--r-sm); color:var(--text-2)}
.btn-go{display:flex; align-items:center; gap:7px; background:var(--ink); color:#fff; font-weight:600; font-size:13px;
  padding:10px 18px; border-radius:var(--r-pill); flex:0 0 auto; transition:transform .15s, background .15s; white-space:nowrap}
.btn-go:hover{transform:translateY(-1px); background:#000}
.btn-go:active{transform:scale(.97)}
.btn-go.busy{background:var(--g-700); pointer-events:none}
.exec-stage{margin-top:12px; display:none; align-items:center; gap:10px; font-size:12.5px; color:var(--text-2);
  border-top:1px dashed var(--border); padding-top:12px}
.exec-stage.on{display:flex}
.exec-stage .spin{width:14px; height:14px; border-radius:50%; border:2px solid var(--g-300); border-top-color:var(--ink); animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.exec-stage .ok{color:var(--success); font-weight:700}

/* 30 天轨迹 */
.traj{width:520px; margin:14px 0 var(--s6); }
.traj .cap{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
.traj .cap b{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); font-weight:700}
.traj .cap span{font-size:11.5px; color:var(--text-3)}
.traj .cap span em{font-style:normal; color:var(--text-2); font-weight:600; font-family:var(--font-mono)}
.trajbox{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-lg); padding:12px 14px; box-shadow:var(--shadow-card)}

/* ---------- 右：模块 Inspector ---------- */
.inspector{border-left:1px solid var(--border-subtle); background:var(--bg-card); padding:var(--s5); overflow-y:auto; display:flex; flex-direction:column; gap:var(--s4)}
.insp-head{display:flex; align-items:center; gap:10px}
.insp-head .ic{width:34px; height:34px; border-radius:10px; display:grid; place-items:center}
.insp-head .ic i{width:13px;height:13px;border-radius:4px;display:block}
.insp-head .tx b{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-3); font-weight:700; display:block}
.insp-head .tx h3{font-size:16px; font-family:var(--font-display); font-weight:400; margin-top:1px}
.insp-body{display:flex; flex-direction:column; gap:var(--s4)}
.metric-row{display:flex; gap:var(--s2)}
.metric{flex:1; background:var(--bg-subtle); border:1px solid var(--border-subtle); border-radius:var(--r-md); padding:10px 12px}
.metric .v{font-family:var(--font-mono); font-size:22px; font-weight:400; line-height:1}
.metric .l{font-size:11px; color:var(--text-3); margin-top:4px; font-weight:500}
/* 可见度条 */
.vis{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.vis .nm{width:74px; font-size:12.5px; color:var(--text-2); font-weight:500}
.vis .track{flex:1; height:7px; background:var(--g-200); border-radius:4px; overflow:hidden}
.vis .track i{display:block; height:100%; border-radius:4px; transition:width .7s cubic-bezier(.2,.7,.2,1)}
.vis .pct{width:30px; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--text-2)}
/* 信号 / 队列条目 */
.feed{display:flex; flex-direction:column; gap:8px}
.fitem{display:flex; gap:10px; padding:10px; border:1px solid var(--border-subtle); border-radius:var(--r-md); transition:background .12s, border-color .12s}
.fitem:hover{background:var(--bg-subtle); border-color:var(--border)}
.fitem .plat{width:24px; height:24px; border-radius:7px; flex:0 0 auto; display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff}
.fitem .ct{flex:1; min-width:0}
.fitem .ct p{font-size:12.5px; line-height:1.35; color:var(--text-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.fitem .ct .mt{font-size:11px; color:var(--text-3); margin-top:4px; display:flex; gap:8px}
.insp-foot{margin-top:auto; padding-top:var(--s4)}
.btn-enter{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:11px;
  border-radius:var(--r-pill); font-weight:600; font-size:13.5px; border:1px solid var(--border);
  transition:background .15s, border-color .15s, transform .15s}
.btn-enter:hover{background:var(--bg-subtle); border-color:var(--ink)}
.btn-enter:active{transform:scale(.98)}

/* status chip */
.st{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:var(--r-pill)}
.st.todo{background:#FFF9C4; color:#92720E}
.st.queue{background:#F7E9CC; color:#92720E}
.st.replied{background:#DCFCE7; color:#16A34A}

/* toast */
.toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--ink); color:#fff; border-radius:var(--r-pill); padding:12px 20px; display:flex; align-items:center; gap:12px;
  box-shadow:var(--shadow-pop); z-index:50; transition:opacity .35s ease, transform .35s cubic-bezier(.2,.8,.2,1); pointer-events:none}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.toast .d{font-family:var(--font-mono); font-weight:600; color:var(--analysis); font-size:15px}
.toast .sep{width:1px; height:16px; background:rgba(255,255,255,.25)}
.toast small{font-size:12px; color:rgba(255,255,255,.7)}
.toast small code{font-family:var(--font-mono); color:#fff}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app theme-postagent">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brandmark">
      <span class="logo"><i></i></span>
      <b>aisee</b><span>· GEO 控制台</span>
    </div>
    <div class="right">
      <div class="plan-pill">GEO 提升计划 · 第 <b id="planDay">1</b> / 30 天</div>
      <button class="btn-rescan" id="btnRescan">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        重新扫描
      </button>
    </div>
  </header>

  <!-- 左：项目 -->
  <aside class="rail">
    <button class="new">＋ 新建项目</button>
    <h6>项目 · 8</h6>
    <div id="projList"></div>
  </aside>

  <!-- 中：闭环驾驶舱 -->
  <main class="stage" id="stage">
    <div class="loopwrap" id="loopwrap">
      <svg class="ring" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="96" fill="none" stroke="var(--g-200)" stroke-width="10"/>
        <!-- 目标缺口刻度 90/100 位置 -->
        <line id="targetTick" x1="110" y1="6" x2="110" y2="22" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round"/>
        <circle id="scoreArc" cx="110" cy="110" r="96" fill="none" stroke="var(--score-high)" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="603"
          style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1), stroke .8s ease"/>
      </svg>
      <div class="center-readout">
        <div class="kick">AI 总分</div>
        <div class="score lcd" id="scoreNum">0</div>
        <div class="target">目标 <b>90</b> · 还差 <b id="gap">—</b></div>
        <div class="pname" id="pName">aisee</div>
      </div>
      <!-- 节点由 JS 定位 -->
      <div class="comet" id="comet"></div>
    </div>

    <!-- 今天的关键一步 -->
    <section class="nextstep" id="nextstep">
      <div class="head">
        <div class="t"><span class="pp"></span><b>今天的关键一步</b></div>
        <div class="gain" id="nsGain">预计 +0</div>
      </div>
      <div class="task-row">
        <div class="chip" id="nsChip">X</div>
        <div class="body">
          <div class="ttl" id="nsTitle">—</div>
          <div class="src">来自 <code id="nsSrc">#--</code> <span id="nsSrcLabel">缺口</span> · <span id="nsType">发布</span></div>
        </div>
        <button class="btn-go" id="btnGo">去执行 →</button>
      </div>
      <div class="exec-stage" id="execStage"></div>
    </section>

    <!-- 30 天轨迹 -->
    <section class="traj">
      <div class="cap">
        <b>30 天分数轨迹</b>
        <span>实际 <em id="trajNow">51.5</em> · 预测达标 <em id="trajEta">第 24 天</em></span>
      </div>
      <div class="trajbox">
        <svg id="trajSvg" viewBox="0 0 492 96" width="100%" height="96" preserveAspectRatio="none"></svg>
      </div>
    </section>
  </main>

  <!-- 右：模块 Inspector -->
  <aside class="inspector" id="inspector"></aside>
</div>

<div class="toast" id="toast">
  <span class="d" id="toastDelta">+2.1</span>
  <span class="sep"></span>
  <small id="toastMsg">分数已更新 · 来自 <code>#ac01</code></small>
</div>

<script>
/* ============================================================
   数据模型（mock）
   ============================================================ */
const PROJECTS = [
  {id:"aisee", name:"aisee", color:"#9ED600", score:51.5, target:90},
  {id:"tesla", name:"tesla", color:"#E1322B", score:88.0, target:90},
  {id:"duolingo", name:"duolingo", color:"#58CC02", score:76.2, target:90},
  {id:"hims", name:"hims", color:"#111111", score:64.1, target:90},
  {id:"robinhood", name:"robinhood", color:"#00C805", score:59.7, target:90},
  {id:"figma", name:"figma", color:"#A259FF", score:91.3, target:90},
  {id:"pinterest", name:"pinterest", color:"#E60023", score:82.5, target:90},
  {id:"claude", name:"claude", color:"#D97757", score:70.4, target:90},
];

// aisee 的执行数据
const STATE = {
  pid:"aisee",
  day:1,
  visibility:[
    {nm:"GPT", v:100}, {nm:"Gemini", v:87}, {nm:"Claude", v:10}, {nm:"Perplexity", v:0}, {nm:"Grok", v:0}
  ],
  counts:{today:5, week:31, month:124, posts:48, queue:12, signals:277, replied:0},
  // backlog：每条都带来源 tag（指回 Analysis 缺口）+ 预计加分
  backlog:[
    {id:"t1", type:"互动", plat:"X", platColor:"#111", title:"X / Reddit 关键词互动 5 条", src:"#ac01", srcLabel:"关键词密度", gain:2.6, mod:"engage"},

/* ============================================================
   闭环四态定义
   ============================================================ */
const LOOP = [
  {key:"diagnose", lab:"诊断", sub:"Analysis", color:"var(--analysis)", ring:"rgba(207,255,41,.55)", halo:"rgba(207,255,41,.16)", angle:-90},
  {key:"plan",     lab:"排程", sub:"任务中心", color:"var(--plan)",     ring:"rgba(17,17,17,.25)",   halo:"rgba(17,17,17,.05)",   angle:0},
  {key:"execute",  lab:"执行", sub:"Post · Engage", color:"var(--post)", ring:"rgba(245,208,0,.55)", halo:"rgba(245,208,0,.14)",  angle:90},
  {key:"rescan",   lab:"复扫", sub:"回到诊断", color:"var(--rescan)",    ring:"rgba(72,215,253,.5)",  halo:"rgba(72,215,253,.13)", angle:180},
];
let activeStage = 0;     // 当前闭环位置
let selNode = 0;         // inspector 选中的节点
const C=110, R=96;       // ring 几何（viewBox 220）

/* ============================================================
   工具
   ============================================================ */
const $=s=>document.querySelector(s);
const cur=()=>PROJECTS.find(p=>p.id===STATE.pid);
// 分数 → 颜色（红→琥珀→青柠→品牌）
function scoreColor(s){
  const stops=[[40,[236,82,18]],[62,[245,166,35]],[80,[158,214,0]],[90,[207,255,41]]];
  if(s<=stops[0][0])return rgb(stops[0][1]);
  if(s>=stops[stops.length-1][0])return rgb(stops[stops.length-1][1]);
  for(let i=0;i<stops.length-1;i++){
    const[a,ca]=stops[i],[b,cb]=stops[i+1];
    if(s>=a&&s<=b){const t=(s-a)/(b-a);return rgb(ca.map((v,k)=>Math.round(v+(cb[k]-v)*t)))}
  }
  return rgb(stops[3][1]);
}
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;

/* ============================================================
   渲染：左侧项目列表
   ============================================================ */
function renderProjects(){
  const wrap=$("#projList"); wrap.innerHTML="";
  PROJECTS.forEach(p=>{
    const el=document.createElement("div");
    el.className="proj"+(p.id===STATE.pid?" active":"");
    el.innerHTML=`
      <div class="ava" style="background:${p.color}">${p.name[0].toUpperCase()}</div>
      <div class="meta">
        <div class="nm">${p.name}</div>
        <div class="bar"><i style="width:${p.score}%;background:${scoreColor(p.score)}"></i></div>
      </div>
      <div class="sc">${p.score.toFixed(1)}</div>`;
    el.onclick=()=>switchProject(p.id);
    wrap.appendChild(el);
  });
}

/* ============================================================
   渲染：闭环节点定位
   ============================================================ */
function placeNodes(){
  const wrap=$("#loopwrap");
  wrap.querySelectorAll(".node").forEach(n=>n.remove());
  const size=wrap.clientWidth, cx=size/2, cy=size/2, rad=size/2*(R/C);
  LOOP.forEach((s,i)=>{
    const a=s.angle*Math.PI/180;
    const x=cx+rad*Math.cos(a), y=cy+rad*Math.sin(a);
    const n=document.createElement("div");
    n.className="node"+(i===selNode?" sel":"")+(i===activeStage?" live":"");
    n.style.left=x+"px"; n.style.top=y+"px";
    n.style.setProperty("--ring",s.ring);
    n.innerHTML=`<div class="dot"><i style="background:${s.color}"></i></div>
      <div class="lab">${s.lab}</div><div class="sub">${s.sub}</div>`;
    n.onclick=()=>{selNode=i; placeNodes(); renderInspector();};
    wrap.appendChild(n);
  });
}

/* ============================================================
   渲染：分数环
   ============================================================ */
let animScore=0;
function setRing(score, animate=true){
  const arc=$("#scoreArc"), col=scoreColor(score);
  const circ=2*Math.PI*R; // 603
  const off=circ*(1-score/100);
  arc.style.strokeDasharray=circ.toFixed(0);
  if(!animate)arc.style.transition="none"; else arc.style.transition="stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1), stroke .8s ease";
  requestAnimationFrame(()=>{arc.style.strokeDashoffset=off; arc.style.stroke=col;});
  if(!animate)requestAnimationFrame(()=>arc.style.transition="stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1), stroke .8s ease");
  // 目标刻度 90 位置（环从顶部 -90 顺时针）
  const ta=(-90+360*0.90)*Math.PI/180;
  $("#targetTick").setAttribute("x1",(C+(R-8)*Math.cos(ta)).toFixed(1));
  $("#targetTick").setAttribute("y1",(C+(R-8)*Math.sin(ta)).toFixed(1));
  $("#targetTick").setAttribute("x2",(C+(R+8)*Math.cos(ta)).toFixed(1));
  $("#targetTick").setAttribute("y2",(C+(R+8)*Math.sin(ta)).toFixed(1));
  // 背景 halo 随分数
  $("#stage").style.setProperty("--halo", col.replace("rgb","rgba").replace(")",",.16)"));
}
function countTo(target, dur=1000){
  const start=animScore, t0=performance.now();
  function step(t){
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    animScore=start+(target-start)*e;
    $("#scoreNum").textContent=animScore.toFixed(1);
    if(k<1)requestAnimationFrame(step); else animScore=target;
  }
  requestAnimationFrame(step);
}
function gapText(p){ const d=p.target-p.score; return d>0 ? "+"+d.toFixed(1) : "已达标 ✓"; }
function updateScoreReadout(){
  const p=cur();
  $("#gap").textContent=gapText(p);
  $("#trajNow").textContent=p.score.toFixed(1);
}

/* ============================================================
   渲染：模块 Inspector（随选中节点变）
   ============================================================ */
function renderInspector(){
  const ins=$("#inspector"), node=LOOP[selNode], p=cur();
  let head=`<div class="insp-head">
      <div class="ic" style="background:${node.key==='plan'?'var(--bg-muted)':node.color}">
        <i style="background:${node.key==='plan'?'var(--ink)':'var(--ink)'}"></i></div>
      <div class="tx"><b>${node.sub}</b><h3>${stageTitle(node.key)}</h3></div>
    </div>`;
  let body="", foot="";
  if(node.key==="diagnose"||node.key==="rescan"){
    body=`<div class="metric-row">
        <div class="metric"><div class="v lcd">${p.score.toFixed(1)}</div><div class="l">当前总分</div></div>
        <div class="metric"><div class="v lcd" style="color:var(--analysis-deep)">${gapText(p)}</div><div class="l">距目标</div></div>
      </div>
      <div><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:12px">AI 引擎可见度</div>
      ${STATE.visibility.map(v=>`<div class="vis"><span class="nm">${v.nm}</span>
        <span class="track"><i style="width:${v.v}%;background:${v.v>=60?'var(--analysis-deep)':v.v>0?'var(--warning)':'var(--g-400)'}"></i></span>
        <span class="pct">${v.v}</span></div>`).join("")}</div>`;
    foot=`<button class="btn-enter">查看完整诊断 →</button>`;
  } else if(node.key==="plan"){
    const c=STATE.counts;
    body=`<div class="metric-row">
        <div class="metric"><div class="v lcd">${c.today}</div><div class="l">今日互动</div></div>
        <div class="metric"><div class="v lcd">${c.week}</div><div class="l">本周互动</div></div>
      </div>
      <div class="metric-row">
        <div class="metric"><div class="v lcd">${STATE.backlog.length}</div><div class="l">待执行任务</div></div>
        <div class="metric"><div class="v lcd">${c.posts}</div><div class="l">本月发布</div></div>
      </div>
      <div class="feed">${STATE.backlog.slice(0,4).map(t=>`
        <div class="fitem"><div class="plat" style="background:${t.platColor}">${t.plat}</div>
          <div class="ct"><p style="color:var(--ink);font-weight:600;-webkit-line-clamp:1">${t.title}</p>
          <div class="mt"><span style="font-family:var(--font-mono)">${t.src}</span><span>${t.srcLabel}</span>
          <span class="st ${t.type==='互动'?'todo':'queue'}">${t.type==='互动'?'待完成':'待发布'}</span></div></div></div>`).join("")}</div>`;
    foot=`<button class="btn-enter">进入任务中心 →</button>`;
  } else if(node.key==="execute"){
    const c=STATE.counts;
    body=`<div class="metric-row">
        <div class="metric"><div class="v lcd" style="color:var(--engage)">${c.signals}</div><div class="l">Engage 新信号</div></div>
        <div class="metric"><div class="v lcd">${c.queue}</div><div class="l">Post 待发布</div></div>
      </div>
      <div><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:10px">Engage · 待回复信号</div>
      <div class="feed">${STATE.signals.map(s=>`<div class="fitem"><div class="plat" style="background:${s.c}">${s.plat}</div>
        <div class="ct"><p>${s.txt}</p><div class="mt"><span>${s.who}</span><span>${s.t}</span></div></div></div>`).join("")}</div></div>
      <div><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:700;margin:4px 0 10px">Post · 发布队列</div>
      <div class="feed">${STATE.queue.map(q=>`<div class="fitem"><div class="plat" style="background:${q.c}">${q.plat}</div>
        <div class="ct"><p style="color:var(--ink);font-weight:600;-webkit-line-clamp:1">${q.txt}</p>
        <div class="mt"><span class="st ${q.st}">${q.st==='queue'?'待发布':'草稿'}</span><span>${q.t}</span></div></div></div>`).join("")}</div></div>`;
    foot=`<button class="btn-enter">进入互动台 / 发布台 →</button>`;
  }
  ins.innerHTML=head+`<div class="insp-body">${body}</div><div class="insp-foot">${foot}</div>`;
}
function stageTitle(k){return {diagnose:"AI 可见度诊断", plan:"任务排程", execute:"执行中的内容", rescan:"扫描看变化"}[k];}

/* ============================================================
   渲染：关键一步
   ============================================================ */
function renderNextStep(){
  const t=STATE.backlog.slice().sort((a,b)=>b.gain-a.gain)[0];
  if(!t){
    $("#nextstep").innerHTML=`<div style="text-align:center;padding:14px 0">
      <div style="font-family:var(--font-display);font-size:18px;margin-bottom:4px">本轮任务已清空 🎉</div>
      <div style="font-size:13px;color:var(--text-3)">重新扫描看分数变化，生成下一批关键动作</div></div>`;
    return;
  }
  $("#nsGain").textContent="预计 +"+t.gain.toFixed(1);
  $("#nsChip").textContent=t.plat; $("#nsChip").style.background=t.platColor;
  $("#nsTitle").textContent=t.title;
  $("#nsSrc").textContent=t.src; $("#nsSrcLabel").textContent=t.srcLabel; $("#nsType").textContent=t.type;
  STATE.nextId=t.id;
}

/* ============================================================
   渲染：30 天轨迹图
   ============================================================ */
function renderTraj(animate=true){
  const svg=$("#trajSvg"), W=492,H=96, pad=6, p=cur();
  const x=d=>pad+(W-2*pad)*(d-1)/29;
  const y=s=>H-pad-(H-2*pad)*(s-45)/(92-45);
  // 预测曲线 51.5→90（缓增）
  let proj=[]; for(let d=1;d<=30;d++){const k=(d-1)/29; const s=p.score+(p.target-p.score)*(1-Math.pow(1-k,1.7)); proj.push([x(d),y(s)]);}
  // 实际：到当前 day 为止，含已执行加分
  const done=STATE.day;
  let act=[]; for(let d=1;d<=done;d++){const s=p.score - (STATE.gainedTotal||0)*(done-d)/Math.max(1,done-1); act.push([x(d), y(d===done? p.score : p.score-(STATE.gainedTotal||0)*(1-(d-1)/Math.max(1,done-1))*0)]);}
  // 简化：实际线就是从 51.5 起点到当前 score 的折线
  const baseScore=51.5;
  act=[[x(1),y(baseScore)]]; if(done>1||p.score!==baseScore)act.push([x(Math.max(done,1)),y(p.score)]);
  const path=a=>a.map((pt,i)=>(i?"L":"M")+pt[0].toFixed(1)+" "+pt[1].toFixed(1)).join(" ");
  // 目标线
  const ty=y(90).toFixed(1);
  svg.innerHTML=`
    <line x1="${pad}" y1="${ty}" x2="${W-pad}" y2="${ty}" stroke="var(--analysis-deep)" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>
    <text x="${W-pad}" y="${ty-4}" text-anchor="end" font-size="9" fill="var(--analysis-deep)" font-family="var(--font-mono)">目标 90</text>
    <path d="${path(proj)}" fill="none" stroke="var(--g-400)" stroke-width="1.6" stroke-dasharray="4 4" opacity=".8"/>
    <path id="actLine" d="${path(act)}" fill="none" stroke="${scoreColor(p.score)}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(Math.max(done,1)).toFixed(1)}" cy="${y(p.score).toFixed(1)}" r="3.6" fill="${scoreColor(p.score)}" stroke="#fff" stroke-width="1.5"/>
    <line x1="${x(done).toFixed(1)}" y1="${pad}" x2="${x(done).toFixed(1)}" y2="${H-pad}" stroke="var(--g-300)" stroke-width="1"/>
    <text x="${x(done).toFixed(1)+4}" y="${H-pad}" font-size="9" fill="var(--text-3)" font-family="var(--font-mono)">第${done}天</text>`;
  if(animate){const pl=svg.querySelector("#actLine"); const len=pl.getTotalLength(); pl.style.strokeDasharray=len; pl.style.strokeDashoffset=len; pl.getBoundingClientRect(); pl.style.transition="stroke-dashoffset .9s ease"; requestAnimationFrame(()=>pl.style.strokeDashoffset=0);}
  // ETA
  let eta="—"; for(let d=1;d<=30;d++){const k=(d-1)/29; const s=51.5+(90-51.5)*(1-Math.pow(1-k,1.7)); if(s>=90){eta="第 "+d+" 天";break;}}
  $("#trajEta").textContent=eta;
}

/* ============================================================
   交互：彗星沿轨道流动
   ============================================================ */
function startComet(){
  const comet=$("#comet"), wrap=$("#loopwrap");
  let t=0;
  function loop(){
    const size=wrap.clientWidth, rad=size/2*(R/C);
    const a=(t/100*2*Math.PI)-Math.PI/2;
    comet.style.left=(size/2+rad*Math.cos(a))+"px";
    comet.style.top=(size/2+rad*Math.sin(a))+"px";
    t=(t+0.22)%100;
    requestAnimationFrame(loop);
  }
  loop();
}

/* ============================================================
   交互：执行闭环（核心动效）
   ============================================================ */
let busy=false;
async function executeStep(){
  if(busy)return; busy=true;
  const t=STATE.backlog.find(x=>x.id===STATE.nextId); if(!t){busy=false;return;}
  const go=$("#btnGo"), es=$("#execStage");
  go.classList.add("busy"); go.textContent="执行中…";
  es.classList.add("on");

  // 闭环推进：排程 → 执行
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  activeStage=1; placeNodes(); // 排程
  es.innerHTML=`<span class="spin"></span><span>进入 <b>${t.mod==='engage'?'互动台':'发布台'}</b>，执行「${t.title}」</span>`;
  await wait(900);

  activeStage=2; placeNodes(); // 执行
  es.innerHTML=`<span class="ok">✓</span><span>内容已${t.mod==='engage'?'回复':'发布'} · web 已更新</span>`;
  await wait(750);

  activeStage=3; placeNodes(); // 复扫
  $("#btnRescan").classList.add("spin");
  es.innerHTML=`<span class="spin"></span><span>重新扫描中，测量 <code style="font-family:var(--font-mono)">${t.src}</code> 缺口变化…</span>`;
  await wait(1100);

  // 应用加分
  const p=cur(), before=p.score;
  p.score=Math.min(99.9, +(p.score+t.gain).toFixed(1));
  STATE.gainedTotal=(STATE.gainedTotal||0)+t.gain;
  STATE.day=Math.min(30, STATE.day+1);
  // 提升对应引擎可见度（演示：把最低的非满引擎拉起来）
  bumpVisibility(t);
  // 从 backlog 移除
  STATE.backlog=STATE.backlog.filter(x=>x.id!==t.id);
  STATE.counts.today+=1; STATE.counts.month+=1;

  activeStage=0; placeNodes(); // 回到诊断
  $("#btnRescan").classList.remove("spin");

  // 更新所有读数
  countTo(p.score, 1100);
  setRing(p.score);
  updateScoreReadout();
  renderProjects();
  renderTraj(true);
  renderInspector();
  $("#planDay").textContent=STATE.day;

  // toast
  showToast("+"+t.gain.toFixed(1), t.src, t.srcLabel);

  // 复位卡片 + 下一步
  es.classList.remove("on"); es.innerHTML="";
  go.classList.remove("busy"); go.textContent="去执行 →";
  await wait(300);
  renderNextStep();
  busy=false;
}
function bumpVisibility(t){
  // 简单演示：把第一个 <100 的引擎提升
  const v=STATE.visibility.find(e=>e.v<100);
  if(v)v.v=Math.min(100, v.v + Math.round(t.gain*4));
}
function showToast(delta, src, label){
  const to=$("#toast");
  $("#toastDelta").textContent=delta;
  $("#toastMsg").innerHTML=`分数已更新 · 来自 <code>${src}</code> ${label}`;
  to.classList.add("on");
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>to.classList.remove("on"), 3200);
}

/* ============================================================
   交互：切换项目
   ============================================================ */
function switchProject(id){
  if(id===STATE.pid||busy)return;
  STATE.pid=id;
  const p=cur();
  // 不同项目演示：用其分数，backlog 这里只对 aisee 完整，其他给精简占位
  renderProjects();
  countTo(p.score, 900);
  setRing(p.score);
  $("#pName").textContent=p.name;
  updateScoreReadout();
  renderTraj(true);
  renderInspector();
}

/* ============================================================
   重新扫描按钮（轻量：重测，分数微动 + 重绘）
   ============================================================ */
$("#btnRescan").onclick=()=>{
  if(busy)return;
  const b=$("#btnRescan"); b.classList.add("spin");
  setTimeout(()=>{b.classList.remove("spin"); renderInspector(); renderTraj(true);},650);
};

/* ============================================================
   初始化
   ============================================================ */
function init(){
  renderProjects();
  placeNodes();
  startComet();
  renderInspector();
  renderNextStep();
  const p=cur();
  updateScoreReadout();
  setRing(0,false);
  setTimeout(()=>{ setRing(p.score); countTo(p.score,1200); renderTraj(true); },180);
  $("#btnGo").onclick=executeStep;
  $("#nextstep").addEventListener("click",e=>{ if(e.target.id==="btnGo")return; });
  window.addEventListener("resize",()=>{placeNodes();});
}
window.addEventListener("load",init);
</script>
