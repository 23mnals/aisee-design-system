<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Engage (Aisee Repo2)" subtitle="Engage v5 — 4-tab Engage zone (Dashboard / Signal Feed / Keywords & Accounts / Replies)" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Engage v5 — aisee-agent</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="ext-resource-dependency" content="engage-aisee-v2/engage-banner-icon.svg" data-resource-id="engageBannerIcon" />

<!-- Karla — local TTF -->
<style>
  @font-face {
    font-family: "Karla";
    src: url("fonts/Karla-VariableFont_wght.ttf") format("truetype");
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --font-karla: "Karla", system-ui, sans-serif;
    --font-gotu:  "Karla", system-ui, sans-serif;
  }
  html, body { background: #FAFAFA; }
  body { font-family: var(--font-karla); }
  ::-webkit-scrollbar       { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(17,17,17,0.12); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,0.22); border: 2px solid transparent; background-clip: content-box; }

  /* Filter bar responsive — same as v1 */
  .fb-chips { scrollbar-width: none; }
  .fb-chips::-webkit-scrollbar { display: none; }
  .fb-chips > * { flex: 0 0 auto; }
  @container (max-width: 900px) {
    .fb-wrap .fb-sync-next { display: none; }
    .fb-wrap .fb-sort-prefix { display: none; }
  }
  @container (max-width: 760px) { .fb-wrap .fb-sync-label { display: none; } }
  @container (max-width: 640px) { .fb-wrap .fb-sync { display: none; } }
</style>

<!-- Tailwind v4 browser build (unpkg — inlinable, self-contained in-browser JIT, works offline). -->
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-primary: #111111;
    --color-yellow-ffe253: #FFE253;
    --color-yellow-fff2b3: #FFF2B3;
    --color-yellow-fffadd: #FFFADD;
    --color-yellow-fefbe3: #FEFBE3;
    --color-yellow-f7f6e9: #F7F6E9;
    --color-yellow-fbfbf3: #FBFBF3;
    --color-yellow-fceb63: #FCEB63;
    --color-gray-fafafa: #FAFAFA;
    --color-gray-f5f5f5: #F5F5F5;
    --color-gray-9dabb7: #9DABB7;
    --color-green-cfff29: #CFFF29;
    --color-green-ceebc8: #CEEBC8;
    --color-green-92bc01: #92BC01;
    --color-green-f0ffba: #F0FFBA;
    --color-green-e6f2db: #E6F2DB;
    --color-green-eff4e2: #EFF4E2;
    --color-green-8c7400: #8C7400;
    --color-red-ffd0d0: #FFD0D0;
    --color-red-ec5212: #EC5212;
    --color-red-e14f12: #E14F12;
    --color-red-fdebe4: #FDEBE4;
    --color-purple-fae2fe: #FAE2FE;
    --color-purple-f3e7f4: #F3E7F4;
    --color-blue-4398ff: #4398FF;
    --font-karla: "Karla", system-ui, sans-serif;
    --font-gotu: "Karla", system-ui, sans-serif;
    --animate-fade-in: fadeInUp 320ms ease-out;
    --animate-click-press: clickPress 320ms cubic-bezier(0.34,1.56,0.64,1);
    --animate-target-pulse: targetPulse 720ms cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes fadeInUp { 0%{transform:translateY(4px);opacity:0;} 100%{transform:translateY(0);opacity:1;} }
  @keyframes clickPress { 0%{transform:scale(1);} 45%{transform:scale(0.86);} 100%{transform:scale(1);} }
  @keyframes targetPulse { 0%{transform:scale(1);} 30%{transform:scale(1.18);} 55%{transform:scale(0.88);} 100%{transform:scale(1);} }
</style>

<body>
  <template id="__bundler_thumbnail" data-bg-color="#F3E7F4">

  <div id="root"></div>

  <!--
    Source order matters. Mirrors v1's repo file mapping but lives under
    engage-aisee-v2/. v5 changes:
      - layout-shell:  224px sidebar, 3-tab Toggle, 4-item Engage sub-nav
      - engage-banner: #F3E7F4 (was #FAE2FE in v4 — that color now Channel-only)
      - dashboard:     new — KPI strip + 2 cream charts + 3 bottom cards
      - signal-feed:   slimmed down to just the Signal Feed view
      - keywords-acc:  unchanged from v4
      - replies:       new — Sent + Awaiting review sub-tabs
      - feed-card:     adds Replied / Expired states with hover tooltip
      - reply-panel:   single "Configure your reply" workspace + Continue
      - page:          4-tab top-level routing
  -->
  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/ui-shims.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/icons.jsx"></script>

  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/dashboard.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/replies.jsx"></script>
