<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8" />
<title>Engage · Initial Setup — aisee</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
  @font-face {
    font-family: "Karla";
    src: url("fonts/Karla-VariableFont_wght.ttf") format("truetype");
    font-weight: 200 800;
    font-style: normal;

  }

    --font-karla: "Karla", system-ui, sans-serif;

    --bg-page: #FFFFFF;
    --bg-canvas: #FCFCFB;
    --cream: #FBFBF3;

    --border-soft: rgba(17,17,17,0.05);
    --muted-40: rgba(17,17,17,0.40);
    --muted-50: rgba(17,17,17,0.50);
    --muted-60: rgba(17,17,17,0.60);
    --muted-70: rgba(17,17,17,0.70);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg-page); }
  body { font-family: var(--font-karla); color: var(--black); -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  input { font-family: inherit; }

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#FFE253">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#FFE253"/>
      <g transform="translate(300,250)">
        <rect x="0" y="0" width="600" height="80" rx="14" fill="#111"/>
        <rect x="0" y="110" width="280" height="180" rx="14" fill="#111"/>
        <rect x="320" y="110" width="280" height="80" rx="14" fill="#111" opacity="0.4"/>
        <rect x="320" y="210" width="280" height="80" rx="14" fill="#111" opacity="0.4"/>
      </g>
    </svg>
  </template>

  <div id="root"></div>

<script type="text/babel" data-presets="env,react">
/* eslint-disable */
const { useState, useMemo } = React;

// ════════════════════════════════════════════════════════════════════
//  PLAN CONFIG — Starter shown as the example.
//  Swap these limits to preview Pro / other tiers.
// ════════════════════════════════════════════════════════════════════
const PLAN = {
  name: "Starter",
  keywords:  { limit: 3 },
  xAccounts: { supported: false },          // X account tracking not on Starter
  subreddits:{ limit: 1 },
};

// ─── Icons ───────────────────────────────────────────────────────────
const S = ({ d, w = 16, sw = 1.7, fill = "none", ...p }) => (
  <svg width={w} height={w} viewBox="0 0 24 24" fill={fill} stroke={fill === "none" ? "currentColor" : "none"}
    strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" {...p}>{d}</svg>
);
const Ic = {
  plus:    (w=14) => <S w={w} sw={2.2} d={<><path d="M5 12h14"/><path d="M12 5v14"/></>} />,
  info:    (w=13) => <S w={w} sw={1.8} d={<><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>} />,
  lock:    (w=14) => <S w={w} sw={1.9} d={<><rect x="4.5" y="11" width="15" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></>} />,
  arrowR:  (w=15) => <S w={w} sw={2} d={<path d="M5 12h14M13 6l6 6-6 6"/>} />,
  spark:   (w=14) => <S w={w} sw={0} fill="currentColor" d={<path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6z"/>} />,
  help:    (w=15) => <S w={w} sw={1.9} d={<><circle cx="12" cy="12" r="10"/><path d="M9.2 9.3a2.8 2.8 0 0 1 5.4 1c0 1.9-2.8 2.5-2.8 2.5"/><path d="M12 17h.01"/></>} />,
  ext:     (w=15) => <S w={w} sw={1.7} d={<><path d="M9 3v3a2 2 0 0 1-2 2H4"/><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6"/></>} />,
  logout:  (w=15) => <S w={w} sw={1.8} d={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></>} />,
  check:   (w=13) => <S w={w} sw={2.4} d={<path d="m20 6-11 11-5-5"/>} />,
  x:       (w=12) => <S w={w} sw={2.3} d={<><path d="M18 6 6 18"/><path d="M6 6l12 12"/></>} />,
};

const NavIc = {
  dash:   <S w={16} sw={1.7} d={<><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></>} />,
  feed:   <S w={16} sw={1.9} d={<><path d="M4 12h2l2-6 4 14 3-9 2 3h3"/></>} />,
  keys:   <S w={16} sw={1.7} d={<><path d="M4 9h16M4 15h16M10 4 8 20M16 4l-2 16"/></>} />,
  reply:  <S w={16} sw={1.7} d={<><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></>} />,
};

// ─── aisee logo (green eye mascot) ───────────────────────────────────
function Logo() {
  return (
    <div className="flex items-center gap-1.5">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
        <path d="M5 17a11 11 0 0 1 22 0v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" fill="var(--lime)"/>
        <circle cx="13.5" cy="16.5" r="5.2" fill="#111"/>
        <circle cx="11.7" cy="14.7" r="1.7" fill="#fff"/>
      </svg>
      <span className="text-[26px] font-extrabold tracking-[-0.03em] leading-none">aisee</span>
    </div>
  );
}

// ─── small UI atoms ──────────────────────────────────────────────────
function Badge({ children, tone = "ink" }) {
  const map = {
    ink:    { bg: "var(--black)",       fg: "#fff" },
    soft:   { bg: "rgba(17,17,17,0.06)", fg: "var(--muted-60)" },
    pro:    { bg: "var(--lavender)",     fg: "var(--violet)" },
  }[tone];
  return (
    <span className="inline-flex items-center h-[20px] px-2 rounded-full text-[11px] font-bold tracking-[0.01em]"
      style={{ background: map.bg, color: map.fg }}>
      {children}
    </span>
  );
}

// counter pill e.g. "0 / 3"
function LimitPill({ used, limit, full }) {
  return (
    <span className="inline-flex items-center h-[22px] px-2.5 rounded-full text-[12px] font-bold tabular-nums"
      style={{
        background: full ? "rgba(236,82,18,0.10)" : "var(--yellow-pale)",
        color: full ? "var(--orange)" : "#8a6d00",
        boxShadow: full ? "inset 0 0 0 1px rgba(236,82,18,0.20)" : "inset 0 0 0 1px rgba(17,17,17,0.05)",
      }}>
      {used} / {limit}
    </span>
  );
}

function StepNum({ n, tone }) {
  const map = {
    1: { bg: "var(--yellow)", fg: "#111" },
    2: { bg: "var(--lavender)", fg: "var(--violet)" },
    3: { bg: "rgba(236,82,18,0.14)", fg: "var(--orange)" },
  }[n];
  return (
    <span className="w-[22px] h-[22px] rounded-full inline-flex items-center justify-center text-[12px] font-extrabold shrink-0"
      style={{ background: map.bg, color: map.fg, ...(tone === "muted" ? { filter: "grayscale(1)", opacity: 0.7 } : {}) }}>
      {n}
    </span>
  );
}

// empty-state framed icon
function EmptyGlyph({ accent = "var(--yellow)" }) {
  return (
    <div className="w-[52px] h-[52px] rounded-[12px] inline-flex items-center justify-center"
      style={{ background: "var(--yellow-pale)", boxShadow: "inset 0 0 0 1px rgba(17,17,17,0.06)" }}>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="3" width="13" height="16" rx="2" fill="#fff" stroke="#111" strokeWidth="1.5"/>
        <path d="M6.5 7.5h7M6.5 10.5h5" stroke="#111" strokeWidth="1.3" strokeLinecap="round"/>
        <circle cx="15.5" cy="15" r="4" fill={accent} stroke="#111" strokeWidth="1.5"/>
        <path d="M18.4 17.9 21 20.5" stroke="#111" strokeWidth="1.7" strokeLinecap="round"/>
      </svg>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════
//  SIDEBAR
// ════════════════════════════════════════════════════════════════════
function Sidebar() {
  const nav = [
    { id: "dashboard", label: "Dashboard", icon: NavIc.dash },
    { id: "feed",      label: "Signal Feed", icon: NavIc.feed },
    { id: "keys",      label: "Keywords & Accounts", icon: NavIc.keys },
    { id: "replies",   label: "Replies", icon: NavIc.reply },
  ];
  return (
    <aside className="w-[244px] shrink-0 h-screen sticky top-0 flex flex-col px-3.5 pt-4 pb-3"
      style={{ borderRight: "1px solid var(--border-soft)", background: "var(--bg-page)" }}>
      {/* product tab switcher */}
      <div className="flex items-center gap-1.5 mb-6">
        <button className="w-9 h-9 rounded-[9px] inline-flex items-center justify-center text-[var(--muted-50)] hover:bg-black/[0.04] transition-colors">
          <S w={16} sw={1.7} d={<><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="9"/></>} />
        </button>
        <button className="w-9 h-9 rounded-[9px] inline-flex items-center justify-center text-[var(--muted-50)] hover:bg-black/[0.04] transition-colors">
          <S w={16} sw={1.7} d={<><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></>} />
        </button>
        <span className="ml-auto inline-flex items-center gap-1.5 h-9 px-3 rounded-[10px] text-[14px] font-bold bg-white"
          style={{ boxShadow: "0 0 0 1px var(--border), 0 1px 2px rgba(0,0,0,0.04)" }}>
          <S w={15} sw={0} fill="#111" d={<path d="M4 4h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-7l-4 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/>} />
          Engage
        </span>
      </div>

      <nav className="flex flex-col gap-0.5">
        {nav.map((it) => (
          <button key={it.id}
            className="flex items-center gap-2.5 h-[38px] px-2.5 rounded-[9px] text-[14px] font-medium transition-colors text-[var(--muted-60)] hover:bg-black/[0.035] hover:text-[var(--black)]">
            <span className="w-5 h-5 inline-flex items-center justify-center opacity-70">{it.icon}</span>
            {it.label}
          </button>
        ))}
      </nav>

      <div className="mt-auto flex flex-col gap-2.5">
        {/* account card */}
        <div className="rounded-[12px] p-2.5"
          style={{ background: "var(--bg-canvas)", boxShadow: "inset 0 0 0 1px var(--border-soft)" }}>
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-full inline-flex items-center justify-center shrink-0"
              style={{ background: "var(--yellow)" }}>
              <svg width="18" height="18" viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="16" r="13" fill="#fff" stroke="#111" strokeWidth="1.4"/>
                <circle cx="16" cy="17" r="6" fill="#111"/><circle cx="13.8" cy="14.6" r="1.8" fill="#fff"/>
              </svg>
            </div>
            <div className="min-w-0">
              <div className="text-[12.5px] font-semibold leading-tight truncate">ccbakala36@gmai.co…</div>
              <div className="text-[11px]" style={{ color: "var(--muted-50)" }}>{PLAN.name} plan</div>
            </div>
          </div>
        </div>
        {/* credits */}
        <div className="px-0.5">
          <div className="flex items-center gap-1.5 mb-1.5">
            <span className="inline-flex" style={{ color: "var(--orange)" }}>{Ic.spark(14)}</span>
            <span className="text-[13px] font-bold tabular-nums">1825 Credits</span>
            <span className="opacity-40">{Ic.info(12)}</span>
          </div>
          <div className="h-[7px] rounded-full overflow-hidden flex" style={{ background: "rgba(17,17,17,0.06)" }}>
            <span style={{ width: "44%", background: "var(--lime)" }} />
            <span style={{ width: "26%", background: "#9B7BD4" }} />
            <span style={{ width: "16%", background: "#F49CC4" }} />
          </div>
        </div>
        <button className="flex items-center gap-2 h-[38px] px-2.5 rounded-[9px] text-[14px] font-medium transition-colors text-[var(--muted-60)] hover:bg-black/[0.035]"
          style={{ marginTop: 2 }}>
          <span className="opacity-70">{Ic.logout(15)}</span> Logout
        </button>
      </div>
    </aside>
  );
}

// ════════════════════════════════════════════════════════════════════
//  TOP BAR
// ════════════════════════════════════════════════════════════════════
function TopBar() {
  return (
    <header className="h-[68px] shrink-0 flex items-center justify-between px-6"
      style={{ borderBottom: "1px solid var(--border-soft)", background: "var(--bg-page)" }}>
      <Logo />
      <div className="flex items-center gap-2.5">
        <button className="h-9 px-3.5 rounded-[10px] inline-flex items-center gap-1.5 text-[13.5px] font-bold transition-colors"
          style={{ background: "var(--yellow-pale)" }}
          onMouseEnter={(e)=>e.currentTarget.style.background="var(--yellow-deep)"}
          onMouseLeave={(e)=>e.currentTarget.style.background="var(--yellow-pale)"}>
          {Ic.ext(15)} Get extension
        </button>
        <button className="w-9 h-9 rounded-full inline-flex items-center justify-center text-white"
          style={{ background: "var(--black)" }}>{Ic.help(15)}</button>
      </div>
    </header>
  );
}

// ════════════════════════════════════════════════════════════════════
//  BANNER
// ════════════════════════════════════════════════════════════════════
function Banner({ kw, sub }) {
  const Counter = ({ label, value, info, locked }) => (
    <div className="flex flex-col items-center gap-0.5 min-w-[78px]">
      <span className="text-[11px] font-medium inline-flex items-center gap-1" style={{ color: "var(--muted-50)" }}>
        {label}{info && <span className="opacity-60">{Ic.info(11)}</span>}
      </span>
      {locked
        ? <span className="inline-flex items-center gap-1 text-[15px] font-bold" style={{ color: "var(--violet)" }}>
            {Ic.lock(13)} <span className="text-[12px] uppercase tracking-[0.03em]">Pro</span>
          </span>
        : <span className="text-[22px] font-extrabold leading-none tabular-nums">{value}</span>}
    </div>
  );
  return (
    <div className="rounded-[16px] flex items-center gap-4 px-5 py-4"
      style={{ background: "var(--lavender)" }}>
      <div className="w-[46px] h-[46px] rounded-[11px] bg-white inline-flex items-center justify-center shrink-0"
        style={{ boxShadow: "inset 0 0 0 1px rgba(139,92,158,0.18)" }}>
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
          <rect x="6" y="8" width="20" height="14" rx="5" fill="var(--violet)"/>
          <circle cx="12" cy="15" r="2" fill="#fff"/><circle cx="20" cy="15" r="2" fill="#fff"/>
          <path d="M11 25c2 2 8 2 10 0" stroke="var(--violet)" strokeWidth="2" strokeLinecap="round"/>
        </svg>
      </div>
      <div className="flex-1 min-w-0">
        <h1 className="text-[21px] font-extrabold leading-tight">Engage</h1>
        <p className="text-[13px] mt-0.5" style={{ color: "var(--muted-60)" }}>
          Monitor and reply to relevant conversations across X and Reddit.
        </p>
      </div>
      <div className="flex items-stretch gap-6 pr-1">
        <Counter label="keywords" value={`${kw} / ${PLAN.keywords.limit}`} info />
        <Counter label="X accounts" locked={!PLAN.xAccounts.supported} value="0" />
        <Counter label="Subreddit" value={`${sub} / ${PLAN.subreddits.limit}`} />
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════
//  FLOW STRIP
// ════════════════════════════════════════════════════════════════════
function FlowStrip() {
  const steps = [
    { t: "Add what to watch", s: "Topics, people or communities",
      ic: <S w={15} sw={0} fill="#111" d={<circle cx="12" cy="12" r="6"/>} /> },
    { t: "Scans X + Reddit", s: "A fresh sweep every 24 hours",
      ic: <S w={16} sw={1.9} d={<><path d="M3 8h13l-3-3M21 16H8l3 3"/></>} /> },
    { t: "Reply from your feed", s: "Matches collect in the Signal Feed",
      ic: <S w={16} sw={0} fill="#111" d={<path d="M4 4h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/>} /> },
  ];
  return (
    <div className="rounded-[14px] flex items-center px-5 py-3.5"
      style={{ background: "var(--bg-canvas)", boxShadow: "inset 0 0 0 1px var(--border-soft)" }}>
      {steps.map((st, i) => (
        <React.Fragment key={i}>
          <div className="flex items-center gap-3 flex-1 min-w-0">
            <span className="w-[34px] h-[34px] rounded-[10px] inline-flex items-center justify-center shrink-0"
              style={{ background: "#EDEAE0" }}>{st.ic}</span>
            <div className="min-w-0">
              <div className="text-[14px] font-bold leading-tight">{st.t}</div>
              <div className="text-[12px]" style={{ color: "var(--muted-50)" }}>{st.s}</div>
            </div>
          </div>
          {i < 2 && <span className="px-4 shrink-0" style={{ color: "var(--muted-40)" }}>{Ic.arrowR(16)}</span>}
        </React.Fragment>
      ))}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════
//  CARD SHELL
// ════════════════════════════════════════════════════════════════════
function Card({ children, locked }) {
  return (
    <div className="rounded-[16px] bg-white relative overflow-hidden h-full"
      style={{ boxShadow: "0 0 0 1px var(--border), 0 1px 3px rgba(0,0,0,0.03)" }}>
      {children}
    </div>
  );
}

function CardHead({ n, title, sub, badge, right }) {
  return (
    <div className="px-5 pt-4 pb-3.5 flex items-start gap-3"
      style={{ borderBottom: "1px dashed var(--border)" }}>
      <StepNum n={n} />
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap">
          <h3 className="text-[16px] font-extrabold leading-none">{title}</h3>
          {badge}
        </div>
        <p className="text-[12.5px] mt-1.5" style={{ color: "var(--muted-50)" }}>{sub}</p>
      </div>
      {right}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════
//  KEYWORDS CARD  (limit: 3)
// ════════════════════════════════════════════════════════════════════
const QUICK_KW = ["GEO optimization", "customer retention", "prompt engineering", "AI search", "churn"];

function KeywordsCard({ keywords, setKeywords }) {
  const [draft, setDraft] = useState("");
  const limit = PLAN.keywords.limit;
  const full = keywords.length >= limit;

  const add = (text) => {
    const t = text.trim();
    if (!t || full || keywords.includes(t)) return;
    setKeywords((a) => [...a, t]);
    setDraft("");
  };
  const remove = (t) => setKeywords((a) => a.filter((x) => x !== t));

  return (
    <Card>
      <CardHead
        n={1} title="Keywords"
        badge={<><Badge tone="ink">Required</Badge><LimitPill used={keywords.length} limit={limit} full={full} /></>}
        sub="Scans X + Reddit every 24 hours. Matches flow into Signal Feed."
      />
      <div className="px-5 py-5 flex flex-col">
        {keywords.length === 0 ? (
          <div className="flex flex-col items-center text-center pt-3 pb-1">
            <EmptyGlyph />
            <div className="text-[16px] font-extrabold mt-3">No keywords yet</div>
            <p className="text-[13px] mt-1.5 max-w-[380px] leading-snug" style={{ color: "var(--muted-50)" }}>
              Keywords catch posts <b className="text-[var(--black)]">by topic</b>. Add a phrase — a brand, a
              competitor, an industry term — and every matching post on X and Reddit lands in your feed to reply to.
            </p>
          </div>
        ) : (
          <div className="flex flex-wrap gap-2 pb-1">
            {keywords.map((k) => (
              <span key={k} className="inline-flex items-center gap-1.5 h-8 pl-3 pr-1.5 rounded-full text-[13px] font-semibold"
                style={{ background: "var(--yellow-pale)", boxShadow: "inset 0 0 0 1px rgba(17,17,17,0.06)" }}>
                {k}
                <button onClick={() => remove(k)} className="w-5 h-5 rounded-full inline-flex items-center justify-center hover:bg-black/10 transition-colors">
                  {Ic.x(11)}
                </button>
              </span>
            ))}
          </div>
        )}

        {/* input */}
        <div className="mt-4 flex items-center gap-2.5 px-3.5 h-[50px] rounded-[12px] transition-colors"
          style={full
            ? { background: "rgba(17,17,17,0.03)", border: "1.5px dashed var(--border)" }
            : { background: "var(--bg-canvas)", border: "1.5px dashed rgba(17,17,17,0.18)" }}>
          {full ? <span style={{ color: "var(--orange)" }}>{Ic.lock(15)}</span> : <span style={{ color: "var(--muted-40)" }}>{Ic.plus(15)}</span>}
          <input
            value={draft}
            disabled={full}
            onChange={(e) => setDraft(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && add(draft)}
            placeholder={full ? `Starter includes ${limit} keywords — upgrade to add more` : "Add a keyword, press Enter to confirm"}
            className="flex-1 bg-transparent border-0 outline-none text-[14px] disabled:cursor-not-allowed"
            style={{ color: full ? "var(--muted-50)" : "var(--black)" }}
          />
        </div>

        {/* quick add / limit note */}
        {full ? (
          <div className="mt-3.5 flex items-center gap-2.5 px-3.5 py-2.5 rounded-[10px]"
            style={{ background: "var(--yellow-pale)", boxShadow: "inset 0 0 0 1px rgba(17,17,17,0.06)" }}>
            <span className="text-[12.5px]" style={{ color: "var(--muted-70)" }}>
              You've used all <b>{limit}</b> Starter keywords.
            </span>
            <button className="ml-auto inline-flex items-center gap-1 h-7 px-3 rounded-full text-[12.5px] font-bold"
              style={{ background: "var(--black)", color: "var(--yellow)" }}>
              {Ic.spark(12)} Upgrade
            </button>
          </div>
        ) : (
          <div className="mt-4 flex items-center gap-2 flex-wrap">
            <span className="text-[11px] font-bold tracking-[0.06em] mr-1" style={{ color: "var(--muted-40)" }}>QUICK ADD</span>
            {QUICK_KW.filter((q) => !keywords.includes(q)).slice(0, 3).map((q) => (
              <button key={q} onClick={() => add(q)}
                className="inline-flex items-center gap-1.5 h-8 px-3 rounded-full text-[13px] font-medium bg-white transition-colors hover:bg-black/[0.03]"
                style={{ boxShadow: "inset 0 0 0 1px var(--border)" }}>
                {Ic.plus(12)} {q}
              </button>
            ))}
          </div>
        )}
      </div>
    </Card>
  );
}

// ════════════════════════════════════════════════════════════════════
//  X ACCOUNTS CARD  (locked on Starter)
// ════════════════════════════════════════════════════════════════════
function XAccountsCard() {
  return (
    <Card>
      <CardHead
        n={2} title="Watch the people shaping your niche"
        badge={<Badge tone="pro">{Ic.lock(11)}<span className="ml-1">Pro</span></Badge>}
        sub="When these accounts post relevant content, it pushes to feed."
        right={
          <button disabled
            className="inline-flex items-center gap-1.5 h-9 px-3.5 rounded-[10px] text-[13px] font-bold cursor-not-allowed"
            style={{ background: "rgba(17,17,17,0.04)", color: "var(--muted-40)" }}>
            {Ic.lock(13)} Add X account
          </button>
        }
      />
      <div className="px-5 py-7 flex flex-col items-center text-center" style={{ opacity: 0.96 }}>
        <div className="relative">
          <div style={{ filter: "grayscale(1)", opacity: 0.45 }}><EmptyGlyph accent="var(--blue)" /></div>
          <span className="absolute -right-2 -bottom-1 w-6 h-6 rounded-full inline-flex items-center justify-center text-white"
            style={{ background: "var(--violet)", boxShadow: "0 0 0 3px #fff" }}>{Ic.lock(12)}</span>
        </div>
        <div className="text-[16px] font-extrabold mt-3">Account tracking is a Pro feature</div>
        <p className="text-[13px] mt-1.5 max-w-[360px] leading-snug" style={{ color: "var(--muted-50)" }}>
          Track the creators and publishers in your space — everything they post reaches your feed.
          <b className="text-[var(--black)]"> Not included on Starter.</b>
        </p>
        <button className="mt-4 inline-flex items-center gap-1.5 h-9 px-4 rounded-full text-[13px] font-bold"
          style={{ background: "var(--black)", color: "var(--yellow)" }}>
          {Ic.spark(13)} Upgrade to track accounts
        </button>
      </div>
    </Card>
  );
}

// ════════════════════════════════════════════════════════════════════
//  SUBREDDITS CARD  (limit: 1)
// ════════════════════════════════════════════════════════════════════
const QUICK_SUB = ["r/SEO", "r/ecommerce", "r/Entrepreneur", "r/marketing"];

function SubredditsCard({ subs, setSubs }) {
  const limit = PLAN.subreddits.limit;
  const full = subs.length >= limit;
  const add = (s) => { if (full || subs.includes(s)) return; setSubs((a) => [...a, s]); };
  const remove = (s) => setSubs((a) => a.filter((x) => x !== s));

  return (
    <Card>
      <CardHead
        n={3} title="Reddit Subreddits"
        badge={<><Badge tone="soft">Optional</Badge><LimitPill used={subs.length} limit={limit} full={full} /></>}
        sub="Monitor keyword-matching posts in these communities."
        right={
          <button disabled={full}
            onClick={() => add(QUICK_SUB.find((q) => !subs.includes(q)))}
            className="inline-flex items-center gap-1.5 h-9 px-3.5 rounded-[10px] text-[13px] font-bold transition-colors"
            style={full
              ? { background: "rgba(17,17,17,0.04)", color: "var(--muted-40)", cursor: "not-allowed" }
              : { background: "var(--black)", color: "#fff" }}>
            {full ? Ic.lock(13) : Ic.plus(13)} Add subreddit
          </button>
        }
      />
      <div className="px-5 py-5">
        {subs.length === 0 ? (
          <div className="flex flex-col items-center text-center pt-1 pb-1">
            <EmptyGlyph accent="var(--orange)" />
            <div className="text-[16px] font-extrabold mt-3">No subreddits yet</div>
            <p className="text-[13px] mt-1.5 max-w-[400px] leading-snug" style={{ color: "var(--muted-50)" }}>
              Subreddits catch posts <b className="text-[var(--black)]">by community</b>. Pick the spaces your audience talks in, and
              keyword-matching threads there land in your feed.
            </p>
          </div>
        ) : (
          <div className="flex flex-col gap-2 pb-1">
            {subs.map((s) => (
              <div key={s} className="flex items-center gap-2.5 h-[44px] px-3 rounded-[10px]"
                style={{ background: "var(--yellow-pale)", boxShadow: "inset 0 0 0 1px rgba(17,17,17,0.06)" }}>
                <span className="w-7 h-7 rounded-lg inline-flex items-center justify-center text-white text-[12px] font-bold"
                  style={{ background: "var(--orange)" }}>r/</span>
                <span className="text-[14px] font-semibold flex-1">{s}</span>
                <button onClick={() => remove(s)} className="w-6 h-6 rounded-full inline-flex items-center justify-center hover:bg-black/10 transition-colors">{Ic.x(12)}</button>
              </div>
            ))}
          </div>
        )}

        {full ? (
          <div className="mt-4 flex items-center gap-2.5 px-3.5 py-2.5 rounded-[10px]"
            style={{ background: "var(--yellow-pale)", boxShadow: "inset 0 0 0 1px rgba(17,17,17,0.06)" }}>
            <span className="text-[12.5px]" style={{ color: "var(--muted-70)" }}>
              Starter tracks <b>{limit}</b> subreddit. Upgrade to monitor more communities.
            </span>
            <button className="ml-auto inline-flex items-center gap-1 h-7 px-3 rounded-full text-[12.5px] font-bold"
              style={{ background: "var(--black)", color: "var(--yellow)" }}>{Ic.spark(12)} Upgrade</button>
          </div>
        ) : (
          <div className="mt-4 flex items-center gap-2 flex-wrap">
            <span className="text-[11px] font-bold tracking-[0.06em] mr-1" style={{ color: "var(--muted-40)" }}>QUICK ADD</span>
            {QUICK_SUB.filter((q) => !subs.includes(q)).slice(0, 3).map((q) => (
              <button key={q} onClick={() => add(q)}
                className="inline-flex items-center gap-1.5 h-8 px-3 rounded-full text-[13px] font-medium bg-white transition-colors hover:bg-black/[0.03]"
                style={{ boxShadow: "inset 0 0 0 1px var(--border)" }}>
                {Ic.plus(12)} {q}
              </button>
            ))}
          </div>
        )}
      </div>
    </Card>
  );
}

// ════════════════════════════════════════════════════════════════════
//  BOTTOM BAR
// ════════════════════════════════════════════════════════════════════
function BottomBar({ kw, sub }) {
  const ready = kw >= 1;
  return (
    <div className="h-[64px] shrink-0 flex items-center justify-between px-6"
      style={{ borderTop: "1px solid var(--border-soft)", background: "var(--bg-page)" }}>
      <div className="flex items-center gap-2 text-[13.5px] whitespace-nowrap">
        {ready ? (
          <span className="inline-flex items-center gap-1.5 font-bold" style={{ color: "#3B8A2E" }}>
            <span className="w-5 h-5 rounded-full inline-flex items-center justify-center text-white" style={{ background: "#3B8A2E" }}>{Ic.check(12)}</span>
            Ready to track
          </span>
        ) : (
          <span className="inline-flex items-center gap-1.5 font-bold" style={{ color: "var(--orange)" }}>
            <span className="w-5 h-5 rounded-full inline-flex items-center justify-center text-white" style={{ background: "var(--orange)" }}>!</span>
            Almost there
          </span>
        )}
        <span style={{ color: "var(--muted-50)" }}>
          <b style={{ color: ready ? "var(--black)" : "var(--orange)" }}>{kw}</b>{!ready && " keyword (need 1+)"}{ready && ` / ${PLAN.keywords.limit} keywords`}
          {"  ·  "}<b className="text-[var(--black)]">{sub} / {PLAN.subreddits.limit}</b> subreddit
          {"  ·  "}<span className="inline-flex items-center gap-1" style={{ color: "var(--violet)" }}>{Ic.lock(11)} X on Pro</span>
        </span>
      </div>
      <button disabled={!ready}
        className="h-10 px-5 rounded-[11px] text-[14px] font-bold transition-colors"
        style={ready
          ? { background: "var(--yellow)", color: "#111" }
          : { background: "rgba(17,17,17,0.12)", color: "rgba(255,255,255,0.9)", cursor: "not-allowed" }}>
        {ready ? "Start tracking →" : "Add a keyword to start"}
      </button>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════
//  PAGE
// ════════════════════════════════════════════════════════════════════
function App() {
  const [keywords, setKeywords] = useState([]);
  const [subs, setSubs] = useState([]);

  return (
    <div className="flex min-h-screen" style={{ background: "var(--bg-page)" }}>
      <Sidebar />
      <div className="flex-1 min-w-0 flex flex-col h-screen">
        <TopBar />
        <main className="flex-1 overflow-y-auto px-6 py-5" style={{ background: "var(--bg-page)" }}>
          <div className="max-w-[1280px] mx-auto flex flex-col gap-4">
            <Banner kw={keywords.length} sub={subs.length} />
            <FlowStrip />
            <div className="grid gap-4 items-start" style={{ gridTemplateColumns: "minmax(0,1.04fr) minmax(0,1fr)" }}>
              <KeywordsCard keywords={keywords} setKeywords={setKeywords} />
              <div className="flex flex-col gap-4">
                <XAccountsCard />
                <SubredditsCard subs={subs} setSubs={setSubs} />
              </div>
            </div>
          </div>
        </main>
        <BottomBar kw={keywords.length} sub={subs.length} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
