<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Update Tutorial — MP4 Recorder</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  @font-face {
    font-family: "Karla";
    src: url("fonts/Karla-VariableFont_wght.ttf") format("truetype");
    font-weight: 200 800; font-style: normal; font-display: swap;
  }
  html, body { background: #FAFAFA; margin: 0; }
  body { font-family: "Karla", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Fixed 328×160 capture stage — recorder upsamples via pixelRatio, layout never changes */
  #capture-area {
    width: 328px; height: 160px;
    background: #FAFAFA;
    box-sizing: border-box; position: relative; overflow: hidden;
  }
  #capture-area .wrap { position: absolute; left: 0; top: 0; width: 328px; height: 160px; }

  #status {
    position: fixed; bottom: 16px; right: 16px;
    background: #111; color: #fff; padding: 12px 18px; border-radius: 12px;
    font-family: 'Karla', monospace; font-size: 13px; z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18); min-width: 260px;
  }
  #status .row { display: flex; justify-content: space-between; gap: 12px; }
  #status .row + .row { margin-top: 4px; }
  #status .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  #download-card {
    position: fixed; bottom: 16px; left: 16px;
    background: #FFE253; color: #111; padding: 14px 22px; border-radius: 12px;
    font-family: 'Karla', sans-serif; font-weight: 700; font-size: 15px;
    text-decoration: none; z-index: 1000; box-shadow: 0 8px 24px rgba(0,0,0,0.18); display: none;
  }
</style>

<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        primary: "#111111",
        "yellow-ffe253": "#FFE253", "yellow-fff2b3": "#FFF2B3", "yellow-fffadd": "#FFFADD",
        "yellow-fbfbf3": "#FBFBF3", "yellow-fceb63": "#FCEB63",
        "gray-fafafa": "#FAFAFA", "gray-f5f5f5": "#F5F5F5",
        "green-cfff29": "#CFFF29", "green-92bc01": "#92BC01",
        "red-ec5212": "#EC5212", "blue-4398ff": "#4398FF",
      },
      fontFamily: { karla: ['Karla', 'system-ui', 'sans-serif'] },
      keyframes: {
        fadeInUp: { "0%": { transform: "translateY(4px)", opacity: "0" }, "100%": { transform: "translateY(0)", opacity: "1" } },
        targetPulse: { "0%": { transform: "scale(1)" }, "30%": { transform: "scale(1.18)" }, "55%": { transform: "scale(0.88)" }, "100%": { transform: "scale(1)" } },
      },
      animation: { "fade-in": "fadeInUp 320ms ease-out", "target-pulse": "targetPulse 720ms cubic-bezier(0.34,1.56,0.64,1)" },
    } }
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/html-to-image@1.11.13/dist/html-to-image.js"></script>
<script src="scratch/mp4-muxer.js"></script>
</head>
<body>
  <div id="capture-area"><div class="wrap"><div id="root"></div></div></div>

  <div id="status">
    <div class="row"><span>Stage</span><span class="v" id="s-stage">init…</span></div>
    <div class="row"><span>Frame</span><span class="v" id="s-frame">0</span></div>
    <div class="row"><span>Anim t</span><span class="v" id="s-elapsed">0.0s</span></div>
    <div class="row"><span>Output</span><span class="v" id="s-output">—</span></div>
  </div>
  <a id="download-card" download="aisee-update-tutorial.mp4">⬇ Download MP4</a>

  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/ui-shims.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/icons.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/update-tutorial.jsx"></script>
  <script type="text/babel" data-presets="env,react">
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.UpdateTutorial));
  </script>

  <script>
    window.__recDone = false; window.__recError = null; window.__mp4Done = false;
    const $ = (id) => document.getElementById(id);
    const setStage = (s) => $('s-stage').textContent = s;
    async function waitFor(p, ms = 8000) {
      const st = performance.now();
      while (!p()) { if (performance.now() - st > ms) throw new Error('waitFor timeout'); await new Promise(r => setTimeout(r, 50)); }
    }
    async function record() {
      try {
        setStage('booting…');
        await waitFor(() => window.UpdateTutorial && window.htmlToImage && window.Mp4Muxer && window.VideoEncoder);
        await waitFor(() => typeof window.__updateTutorialSetCaptureT === "function");
        await waitFor(() => document.querySelector('#root [style*="rgba(144"]'));

        const SCALE = 4, BASE_W = 328, BASE_H = 160;
        const W = BASE_W * SCALE, H = BASE_H * SCALE;   // 1312 × 640
        const FPS = 30, DURATION_MS = 11400, BITRATE = 6_000_000;
        const target = document.getElementById('capture-area');

        const muxer = new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video: { codec: 'avc', width: W, height: H, frameRate: FPS },
          fastStart: 'in-memory',
        });
        const encoder = new VideoEncoder({
          output: (c, m) => muxer.addVideoChunk(c, m),
          error: (e) => { window.__recError = 'encoder: ' + e.message; },
        });
        encoder.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: BITRATE, framerate: FPS, avc: { format: 'avc' } });

        window.__updateTutorialSetCaptureT(0);
        await new Promise(r => setTimeout(r, 32));
        await new Promise(r => setTimeout(r, 32));

        setStage('priming…');
        try { await window.htmlToImage.toCanvas(target, { pixelRatio: SCALE, skipFonts: true }); } catch (e) {}

        setStage('recording');
        const FRAME_MS = 1000 / FPS;
        const TOTAL = Math.ceil(DURATION_MS / FRAME_MS);
        let n = 0;
        for (let i = 0; i < TOTAL; i++) {
          const at = i * FRAME_MS;
          window.__updateTutorialSetCaptureT(at);
          await new Promise(r => setTimeout(r, 24));
          let snap;
          try { snap = await window.htmlToImage.toCanvas(target, { pixelRatio: SCALE, skipFonts: true, cacheBust: false }); }
          catch (e) { window.__snapErr = String(e).slice(0, 200); continue; }
          const vf = new VideoFrame(snap, { timestamp: Math.round(at * 1000), duration: Math.round(FRAME_MS * 1000) });
          encoder.encode(vf, { keyFrame: i % 30 === 0 });
          vf.close();
          n++; $('s-frame').textContent = n; $('s-elapsed').textContent = (at / 1000).toFixed(2) + 's';
        }

        setStage('flushing…');
        await encoder.flush(); encoder.close(); muxer.finalize();
        const { buffer } = muxer.target;
        $('s-output').textContent = (buffer.byteLength / 1048576).toFixed(2) + ' MB · ' + n + ' frames';
        const blob = new Blob([buffer], { type: 'video/mp4' });
        const dl = $('download-card');
        dl.href = URL.createObjectURL(blob); dl.style.display = 'block';
        window.__mp4Done = true; setStage('done ✓');
      } catch (e) {
        window.__recError = String(e && e.stack || e); setStage('error');
      } finally { window.__recDone = true; }
    }
    window.addEventListener('load', () => setTimeout(record, 700));
  </script>
</body>
</html>
