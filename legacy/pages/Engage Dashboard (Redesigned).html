<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Engage Dashboard (Redesigned)" subtitle="Action-first KPIs, calendar removed, replaces 'Upcoming Replies' with review queue" viewport="1440x1100" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engage Dashboard — aisee</title>
  <link rel="stylesheet" href="engage/styles.css" />
  <style>
    /* ─── Dashboard-specific styles ─────────────────────────── */

    .dash-page { padding: 0 24px 32px; }

    /* Banner override — collapse settings counts, promote actionable */
    .dash-banner {
      margin: 20px 0 0;
      border-radius: 14px;
      background: #F3E7F4;
      min-height: 76px;
      padding: 15px 22px;
      display: flex; align-items: center; gap: 16px;
    }
    .dash-banner .ic {
      width: 46px; height: 46px; border-radius: 10px; background: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 2px rgba(17,17,17,0.06); flex-shrink: 0;
    }
    .dash-banner h1 { font-family:'Karla'; font-weight:700; font-size:20px; line-height:24px; margin:0; }
    .dash-banner .sub { font-size:12.5px; line-height:18px; color: rgba(17,17,17,0.6); margin-top:3px; }
    .dash-banner .titles { flex: 1; min-width: 0; }
    .dash-banner .b-stats {
      display: flex; align-items: center; gap: 28px;
    }
    .dash-banner .b-stat { display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
    .dash-banner .b-stat .lbl {
      font-size: 10px; color: rgba(17,17,17,0.55); font-weight:500;
      letter-spacing:0.04em; text-transform: uppercase; line-height:14px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .dash-banner .b-stat .num {
      font-weight: 700; font-size: 22px; line-height: 24px;
      font-variant-numeric: tabular-nums;
      display: inline-flex; align-items: baseline; gap: 6px;
    }
    .dash-banner .b-stat .num .pill-act {
      font-size: 10px; font-weight: 600;
      background: #111; color: #FFE253;
      padding: 1px 7px; border-radius: 999px;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    /* Section heading */
    .dash-h {
      display: flex; align-items: center; gap: 10px;
      margin: 26px 0 12px;
    }
    .dash-h h2 {
      font-family: 'Karla'; font-weight: 600; font-size: 15px;
      margin: 0; color: var(--black);
    }
    .dash-h .meta {
      font-size: 12px; color: var(--muted); font-weight: 400;
    }
    .dash-h .right {
      margin-left: auto; display: inline-flex; gap: 8px;
    }
    .dash-h .info-i {
      width: 14px; height: 14px; display:inline-flex; color: var(--muted);
    }

    /* Range tabs (reused look) */
    .range-tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px;
      background: rgba(17,17,17,0.04); border: 1px solid var(--border);
    }
    .range-tabs button {
      height: 24px; padding: 0 10px; border-radius: 6px;
      font-size: 12px; font-weight: 500; color: var(--muted);
    }
    .range-tabs button.on { background: var(--white); color: var(--black);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

    /* KPI cards row */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .kpi {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px 14px;
      display: flex; flex-direction: column; gap: 6px;
      position: relative;
      transition: border-color .15s var(--ease);
    }
    .kpi:hover { border-color: var(--border-hover); }
    .kpi .lbl {
      font-size: 11px; font-weight: 500; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .kpi .num {
      font-family: 'Karla'; font-weight: 700;
      font-size: 32px; line-height: 1.1;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      display: inline-flex; align-items: baseline; gap: 4px;
    }
    .kpi .num .unit { font-weight: 500; font-size: 16px; color: var(--muted); }
    .kpi .delta {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 600;
      color: #2e7d2f;
    }
    .kpi .delta.down { color: var(--orange); }
    .kpi .delta .arrow { display: inline-flex; }
    .kpi .delta .vs { color: var(--muted); font-weight: 400; margin-left: 2px; }

    /* Quality KPI variant — accent border */
    .kpi.accent {
      background: linear-gradient(180deg, #FFFADD 0%, #fff 65%);
      border-color: rgba(255, 226, 83, 0.6);
    }

    /* Two-col charts */
    .chart-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .card-h .ttl { font-size: 13px; font-weight: 500; color: var(--muted); }
    .card-h .right { margin-left: auto; display:inline-flex; gap: 8px; align-items: center; }
    .card .big-num {
      font-family: 'Karla'; font-weight: 700;
      font-size: 28px; line-height: 1.1; margin: 2px 0 12px;
      font-variant-numeric: tabular-nums;
      display: inline-flex; align-items: baseline; gap: 8px;
    }
    .card .big-num .delta { font-size: 12px; font-weight: 600; color: #2e7d2f; }

    /* Bottom row — 3 cols: queue (wide), top replies, platform mix */
    .bottom-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 0.85fr;
      gap: 12px;
    }

    /* Plat pill (reused styling concept) */
    .plat-toggle {
      display: inline-flex; gap: 4px; padding: 3px;
      border-radius: 8px; background: rgba(17,17,17,0.04);
      border: 1px solid var(--border);
    }
    .plat-toggle button {
      height: 24px; padding: 0 10px; border-radius: 6px;
      font-size: 12px; font-weight: 500; color: var(--muted);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .plat-toggle button.on { background: var(--white); color: var(--black);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .plat-toggle button .dot {
      width: 12px; height: 12px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      background: #111; color: #fff; font-size: 7px;
    }
    .plat-toggle button .dot.r { background: var(--orange); }
    .plat-toggle button .dot svg { width: 7px; height: 7px; }

    /* Bar chart */
    .bars { display: flex; align-items: stretch; gap: 8px; height: 220px; padding: 6px 0 0; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 0; position: relative; }
    .bar { width: 100%; max-width: 22px;
      display: flex; flex-direction: column; justify-content: flex-end;
      flex: 1; min-height: 0;
    }
    .bar-seg { width: 100%; display:block; }
    .bar-seg.x { background: var(--primary); border-radius: 3px 3px 0 0; }
    .bar-seg.r { background: var(--orange); border-radius: 3px 3px 0 0; }
    .bar-col.has-both .bar-seg.x { border-radius: 0; }
    .bar-col.has-both .bar-seg.r { border-radius: 3px 3px 0 0; }
    .bar-col.peak { position: relative; }
    .bar-col .lbl { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .bar-tooltip {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: 40px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      box-shadow: var(--shadow-dropdown);
      white-space: nowrap;
      z-index: 5;
      min-width: 100px;
    }
    .bar-tooltip .tt-day { font-weight: 600; margin-bottom: 4px; }
    .bar-tooltip .tt-row { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
    .bar-tooltip .tt-row .lbl { display:inline-flex; align-items:center; gap:4px; }

    /* Area chart container */
    .area-wrap {
      position: relative;
      height: 210px;
    }
    .area-wrap svg { width: 100%; height: 100%; display: block; }
    .area-y { position: absolute; left: 0; top: 0; bottom: 18px; width: 36px;
      display: flex; flex-direction: column; justify-content: space-between;
      font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .area-x { position: absolute; left: 36px; right: 0; bottom: 0;
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .area-plot { position: absolute; left: 36px; right: 4px; top: 0; bottom: 18px; }

    /* Queue (Awaiting review) */
    .queue-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .queue-item {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 12px; align-items: flex-start;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color .15s var(--ease), background .15s var(--ease);
      cursor: pointer;
    }
    .queue-item:hover { border-color: var(--border-hover); background: #FBFAF4; }
    .queue-av {
      width: 28px; height: 28px; border-radius: 999px;
      background: #FFFADD; color: #111;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px;
      position: relative;
    }
    .queue-av.r { background: #FFE3D5; }
    .queue-av .plat-mini {
      position: absolute; right: -2px; bottom: -2px;
      width: 14px; height: 14px; border-radius: 999px;
      background: #111; color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      border: 2px solid #fff; font-size: 7px;
    }
    .queue-av .plat-mini.r { background: var(--orange); }
    .queue-av .plat-mini svg { width: 7px; height: 7px; }
    .queue-body { min-width: 0; }
    .queue-head {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; margin-bottom: 2px;
    }
    .queue-head .who { font-weight: 600; color: var(--black); }
    .queue-head .handle { color: var(--muted); }
    .queue-head .dot { width: 3px; height: 3px; border-radius: 999px; background: rgba(17,17,17,0.3); }
    .queue-head .time { color: var(--muted); }
    .queue-source {
      font-size: 12.5px; line-height: 1.45;
      color: var(--black);
      overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    }
    .queue-draft {
      font-size: 12px; color: var(--muted);
      margin-top: 4px;
      padding: 6px 8px;
      background: var(--primary-pale);
      border-radius: 6px;
      border-left: 2px solid var(--primary);
      overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .queue-actions {
      display: inline-flex; flex-direction: column; gap: 6px;
      flex-shrink: 0;
    }
    .queue-btn {
      height: 26px; padding: 0 10px;
      border-radius: 6px;
      font-size: 11px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      transition: background .15s var(--ease);
      border: 1px solid transparent;
    }
    .queue-btn.send { background: #111; color: #fff; }
    .queue-btn.send:hover { background: #000; }
    .queue-btn.edit { background: transparent; color: var(--muted); border-color: var(--border); }
    .queue-btn.edit:hover { border-color: var(--border-hover); color: var(--black); }

    /* Top replies (insight) */
    .top-replies { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .top-rep {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      gap: 10px; align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed rgba(17,17,17,0.08);
    }
    .top-rep:last-child { border-bottom: 0; }
    .top-rep .rank {
      width: 22px; height: 22px; border-radius: 6px;
      background: rgba(17,17,17,0.04); color: var(--muted);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 11px;
    }
    .top-rep .body {
      min-width: 0;
      display: flex; flex-direction: column; gap: 3px;
    }
    .top-rep .body .who {
      font-size: 12px; color: var(--muted);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .top-rep .body .who .pi {
      width: 12px; height: 12px; border-radius: 999px;
      background: #111; color: #fff;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .top-rep .body .who .pi.r { background: var(--orange); }
    .top-rep .body .who .pi svg { width: 7px; height: 7px; }
    .top-rep .body .snip {
      font-size: 12.5px; line-height: 1.35;
      overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    }
    .top-rep .stat {
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 1px;
    }
    .top-rep .stat .v {
      font-weight: 700; font-size: 14px;
      font-variant-numeric: tabular-nums;
      display: inline-flex; align-items: baseline; gap: 4px;
    }
    .top-rep .stat .v .u { font-weight: 500; font-size: 10px; color: var(--muted); }
    .top-rep .stat .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

    /* Platform mix (donut) */
    .mix-wrap { display: flex; flex-direction: column; gap: 14px; align-items: center; padding-top: 4px; }
    .mix-donut { position: relative; width: 140px; height: 140px; }
    .mix-donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .mix-donut .center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0;
    }
    .mix-donut .center .v {
      font-family: 'Karla'; font-weight: 700; font-size: 22px;
      font-variant-numeric: tabular-nums;
    }
    .mix-donut .center .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .mix-legend { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .mix-legend .row {
      display: grid;
      grid-template-columns: 18px 1fr auto auto;
      gap: 8px; align-items: center;
      font-size: 12px;
    }
    .mix-legend .row .sw {
      width: 12px; height: 12px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .mix-legend .row .sw.x { background: var(--primary); }
    .mix-legend .row .sw.r { background: var(--orange); color: #fff; font-size: 7px; font-weight: 800; font-style: italic; font-family: 'Karla'; letter-spacing: -0.05em; }
    .mix-legend .row .sw svg { width: 7px; height: 7px; }
    .mix-legend .row .nm { color: var(--black); }
    .mix-legend .row .pc {
      font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .mix-legend .row .ct { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    /* Empty-friendly hint */
    .hint {
      font-size: 11.5px; color: var(--muted); line-height: 1.4;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(17,17,17,0.08);
    }
    .hint strong { color: var(--black); font-weight: 600; }

    /* ── Edit mode for queue item ── */
    .queue-item.editing {
      grid-template-columns: 28px 1fr;
      background: #FFFEF5;
      border-color: rgba(255,226,83,0.7);
    }
    .queue-item.editing .queue-actions { display: none; }
    .queue-edit {
      margin-top: 8px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .queue-edit textarea {
      width: 100%; min-height: 78px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: 'Karla', sans-serif;
      font-size: 13px; line-height: 1.5;
      color: var(--black);
      background: #fff;
      outline: none;
      transition: border-color .15s var(--ease);
    }
    .queue-edit textarea:focus { border-color: #111; }
    .queue-edit-foot {
      display: flex; align-items: center; gap: 8px;
    }
    .queue-edit-foot .char {
      font-size: 11px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .queue-edit-foot .nav-link {
      font-size: 11px; color: var(--muted);
      display: inline-flex; align-items: center; gap: 4px;
      text-decoration: none;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background .15s var(--ease), color .15s var(--ease);
    }
    .queue-edit-foot .nav-link:hover { background: rgba(17,17,17,0.04); color: var(--black); }
    .queue-edit-foot .spacer { flex: 1; }
    .queue-edit-foot button { font-family: inherit; cursor: pointer; }

    /* Empty state */
    .queue-empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .queue-empty .icon {
      width: 40px; height: 40px;
      margin: 0 auto 10px;
      border-radius: 999px;
      background: var(--primary-pale);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--black);
    }
    .queue-empty .ttl { color: var(--black); font-weight: 600; font-size: 13px; margin-bottom: 2px; }

    /* Toast */
    .toast-stack {
      position: fixed;
      bottom: 20px; right: 24px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 100;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: #111; color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      min-width: 260px; max-width: 380px;
      animation: toastIn .25s var(--ease-out);
    }
    .toast.success .icon {
      width: 18px; height: 18px; border-radius: 999px;
      background: var(--primary); color: #111;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .toast .body { flex: 1; min-width: 0; }
    .toast .body .sub { color: rgba(255,255,255,0.6); font-size: 11px; margin-top: 1px; }
    .toast .undo {
      color: var(--primary); font-weight: 600; font-size: 12px;
      cursor: pointer; padding: 4px 8px; border-radius: 6px;
      background: transparent; border: 0;
    }
    .toast .undo:hover { background: rgba(255,255,255,0.08); }
    @keyframes toastIn {
      from { transform: translateY(8px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    /* Chart legend dot */
    .leg-dot {
      width: 14px; height: 14px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .leg-dot.x { background: #111; }
    .leg-dot.r { background: var(--orange); }
    .leg-dot svg { width: 8px; height: 8px; }

  </style>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#FFE253">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#FFE253"/>
      <g transform="translate(280,220)">
        <rect x="0" y="0" width="180" height="120" rx="14" fill="#111"/>
        <rect x="200" y="0" width="180" height="120" rx="14" fill="#111"/>
        <rect x="400" y="0" width="180" height="120" rx="14" fill="#111"/>
        <rect x="0" y="140" width="380" height="220" rx="14" fill="#111"/>
        <rect x="400" y="140" width="180" height="220" rx="14" fill="#111"/>
      </g>
    </svg>
  </template>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="engage/icons.jsx"></script>
  <script type="text/babel" src="engage/shell.jsx"></script>

</html>
