<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Install Tutorial — MP4 Recorder</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
  @font-face {
    font-family: "Karla";
    src: url("fonts/Karla-VariableFont_wght.ttf") format("truetype");
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }
  html, body { background: #FAFAFA; margin: 0; }
  body { font-family: "Karla", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Fixed-size capture stage matching the output MP4 dimensions */
  #capture-area {
    width: 328px;
    height: 160px;
    background: #FAFAFA;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  #capture-area .wrap {
    position: absolute;
    left: 0;
    top: 0;
    width: 328px;
    height: 160px;
  }

  #status {
    position: fixed; bottom: 16px; right: 16px;
    background: #111; color: #fff; padding: 12px 18px; border-radius: 12px;
    font-family: 'Karla', monospace; font-size: 13px;
    z-index: 1000; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    min-width: 280px;
  }
  #status .row { display: flex; justify-content: space-between; gap: 12px; }
  #status .row + .row { margin-top: 4px; }
  #status .v { font-weight: 700; font-variant-numeric: tabular-nums; }

  #download-card {
    position: fixed;
    bottom: 16px; left: 16px;
    background: #FFE253; color: #111; padding: 14px 22px; border-radius: 12px;
    font-family: 'Karla', sans-serif; font-weight: 700; font-size: 15px;
    text-decoration: none; z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    display: none;
  }
</style>

<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: "#111111",
          "yellow-ffe253": "#FFE253",
          "yellow-fff2b3": "#FFF2B3",
          "yellow-fffadd": "#FFFADD",
          "yellow-fbfbf3": "#FBFBF3",
          "yellow-fceb63": "#FCEB63",
          "gray-fafafa":  "#FAFAFA",
          "gray-f5f5f5":  "#F5F5F5",
          "green-cfff29": "#CFFF29",
          "green-92bc01": "#92BC01",
          "blue-4398ff":  "#4398FF",
        },
        fontFamily: { karla: ['Karla', 'system-ui', 'sans-serif'] },
        keyframes: {
          fadeInUp:   { "0%": { transform: "translateY(4px)", opacity: "0" }, "100%": { transform: "translateY(0)", opacity: "1" } },
          clickPress: { "0%": { transform: "scale(1)" }, "45%": { transform: "scale(0.86)" }, "100%": { transform: "scale(1)" } },
          targetPulse: { "0%": { transform: "scale(1)" }, "30%": { transform: "scale(1.18)" }, "55%": { transform: "scale(0.88)" }, "100%": { transform: "scale(1)" } },
        },
        animation: {
          "fade-in": "fadeInUp 320ms ease-out",
          "click-press": "clickPress 320ms cubic-bezier(0.34,1.56,0.64,1)",
          "target-pulse": "targetPulse 720ms cubic-bezier(0.34,1.56,0.64,1)",
        },
      }
    }
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="https://unpkg.com/html-to-image@1.11.13/dist/html-to-image.js"></script>
<script src="scratch/mp4-muxer.js"></script>
</head>
<body>
  <div id="capture-area">
    <div class="wrap">
      <div id="root"></div>
    </div>
  </div>

  <div id="status">
    <div class="row"><span>Stage</span><span class="v" id="s-stage">init…</span></div>
    <div class="row"><span>Frame</span><span class="v" id="s-frame">0</span></div>
    <div class="row"><span>Elapsed</span><span class="v" id="s-elapsed">0.0s</span></div>
    <div class="row"><span>Snap ms</span><span class="v" id="s-snap">—</span></div>
    <div class="row"><span>Output</span><span class="v" id="s-output">—</span></div>
  </div>

  <a id="download-card" download="aisee-install-tutorial.mp4">⬇ Download MP4</a>

  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/ui-shims.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/icons.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/install-tutorial.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { createRoot } = ReactDOM;
    createRoot(document.getElementById("root")).render(
      React.createElement(window.InstallTutorial)
    );
  </script>

  <script>
    window.__recDone   = false;
    window.__recError  = null;
    window.__mp4Base64 = null;
    window.__mp4Mime   = "video/mp4";
    window.__mp4ByteLength = 0;

    const $s = (id) => document.getElementById(id);
    const setStage   = (s) => $s('s-stage').textContent = s;
    const setFrame   = (n) => $s('s-frame').textContent = String(n);
    const setElapsed = (s) => $s('s-elapsed').textContent = s.toFixed(2) + 's';
    const setSnap    = (s) => $s('s-snap').textContent = s.toFixed(0) + ' ms';
    const setOutput  = (s) => $s('s-output').textContent = s;

    async function waitFor(predicate, ms = 8000) {
      const start = performance.now();
      while (!predicate()) {
        if (performance.now() - start > ms) throw new Error('waitFor timeout');
        await new Promise(r => setTimeout(r, 50));
      }
    }

    async function record() {
      try {
        setStage('booting…');
        await waitFor(() => window.InstallTutorial && window.htmlToImage && window.Mp4Muxer && window.VideoEncoder);
        await waitFor(() => document.querySelector('#root [style*="rgba(144"]'));
        await waitFor(() => typeof window.__installTutorialSetCaptureT === "function");

        const W = 1312, H = 640;            // 4× of 328×160 — HD output
        const FPS = 30;
        const DURATION_MS = 7600;
        const BITRATE = 6_000_000;
        const target = document.getElementById('capture-area');

        const muxer = new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video: { codec: 'avc', width: W, height: H, frameRate: FPS },
          fastStart: 'in-memory',
        });
        const encoder = new VideoEncoder({
          output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
          error:  (e) => { window.__recError = 'encoder: ' + e.message; },
        });
        encoder.configure({
          codec: 'avc1.640028',
          width: W, height: H,
          bitrate: BITRATE,
          framerate: FPS,
          avc: { format: 'avc' },
        });

        // Switch InstallTutorial into deterministic capture mode
        window.__installTutorialSetCaptureT(0);
        await new Promise(r => requestAnimationFrame(r));
        await new Promise(r => requestAnimationFrame(r));

        setStage('priming…');
        try { await window.htmlToImage.toCanvas(target, { pixelRatio: 4, skipFonts: true }); } catch (e) {}

        setStage('recording');
        const FRAME_DURATION_MS = 1000 / FPS;
        const TOTAL_FRAMES = Math.ceil(DURATION_MS / FRAME_DURATION_MS);
        let frameIdx = 0;
        const t0 = performance.now();
        for (let i = 0; i < TOTAL_FRAMES; i++) {
          const animTime = i * FRAME_DURATION_MS;
          window.__installTutorialSetCaptureT(animTime);
          await new Promise(r => requestAnimationFrame(r));
          await new Promise(r => requestAnimationFrame(r));
          let snap;
          try {
            snap = await window.htmlToImage.toCanvas(target, { pixelRatio: 4, skipFonts: true, cacheBust: false });
          } catch (e) { window.__snapErr = String(e).slice(0, 200); continue; }
          const tsUs = Math.round(animTime * 1000);
          const vf = new VideoFrame(snap, { timestamp: tsUs, duration: Math.round(FRAME_DURATION_MS * 1000) });
          encoder.encode(vf, { keyFrame: i % 30 === 0 });
          vf.close();
          frameIdx++;
          setFrame(frameIdx);
          setElapsed(animTime / 1000);
          setSnap((performance.now() - t0) / frameIdx);
        }

        setStage('flushing…');
        await encoder.flush();
        encoder.close();
        muxer.finalize();
        const { buffer } = muxer.target;
        window.__mp4ByteLength = buffer.byteLength;
        setOutput((buffer.byteLength / 1024 / 1024).toFixed(2) + ' MB · ' + frameIdx + ' frames');

        setStage('base64…');
        const blob = new Blob([buffer], { type: 'video/mp4' });
        const url  = URL.createObjectURL(blob);
        const dl   = $s('download-card');
        dl.href = url;
        dl.style.display = 'block';

        const bytes = new Uint8Array(buffer);
        let binStr = '';
        const CHUNK = 0x8000;
        for (let i = 0; i < bytes.length; i += CHUNK) {
          binStr += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
        }
        window.__mp4Base64 = btoa(binStr);
        window.__mp4Done = true;
        setStage('done ✓');
      } catch (e) {
        window.__recError = String(e && e.stack || e);
        setStage('error');
        setOutput('see __recError');
      } finally {
        window.__recDone = true;
      }
    }

    window.addEventListener('load', () => setTimeout(record, 600));
  </script>
</body>
</html>
