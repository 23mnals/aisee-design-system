<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Real logo image — full wordmark, sizes, backgrounds, mark scale" viewport="700x420" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face { font-family: 'Karla'; src: url('../fonts/Karla-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; }
@font-face { font-family: 'Gotu'; src: url('../fonts/Gotu-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; padding: 24px; font-family: 'Karla', sans-serif; }
.row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.label { font-size: 10px; color: #aaa; margin-top: 8px; }

.logo-mark { display: block; object-fit: contain; flex-shrink: 0; }
.logo-wordmark { display: block; object-fit: contain; }
</style>
</head>
<body>
<div class="row">

  <!-- Small -->
  <div style="text-align:center;">
    <div style="display:flex;align-items:center;gap:6px;">
      <img class="logo-mark" src="../assets/aisee-logo-mark.png" alt="AISEE logo mark" style="width:20px;height:20px;">
      <span style="font-family:'Karla';font-size:14px;font-weight:500;color:#111;">aisee</span>
    </div>
    <div class="label">Small (20px)</div>
  </div>

  <!-- Standard -->
  <div style="text-align:center;">
    <div style="display:flex;align-items:center;gap:8px;">
      <img class="logo-wordmark" src="../assets/logo-wordmark.png" alt="AISEE wordmark" style="width:88px;height:40px;">
    </div>
    <div class="label">Standard (25px)</div>
  </div>

  <!-- Large -->
  <div style="text-align:center;">
    <div style="display:flex;align-items:center;gap:12px;">
      <img class="logo-wordmark" src="../assets/logo-wordmark.png" alt="AISEE wordmark large" style="width:142px;height:64px;">
    </div>
    <div class="label">Large (48px)</div>
  </div>

  <!-- On dark -->
  <div style="background:#111;border-radius:12px;padding:16px 20px;text-align:center;">
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:3px 10px;">
      <img class="logo-wordmark" src="../assets/logo-wordmark.png" alt="AISEE wordmark on a white safety area" style="width:88px;height:40px;">
    </div>
    <div class="label" style="color:#555;">On dark</div>
  </div>

  <!-- On lime -->
  <div style="background:#CFF229;border-radius:12px;padding:16px 20px;text-align:center;">
    <div style="display:flex;align-items:center;gap:8px;">
      <img class="logo-mark" src="../assets/aisee-logo-mark.png" alt="AISEE logo mark on lime" style="width:26px;height:26px;">
      <span style="font-family:'Karla';font-size:16px;font-weight:600;color:#111;">aisee</span>
    </div>
    <div class="label" style="color:rgba(17,17,17,0.6);">On lime</div>
  </div>

</div>
</body>
</html>
