<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>aisee install tutorial — recordable loop</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
  @font-face {
    font-family: "Karla";
    src: url("fonts/Karla-VariableFont_wght.ttf") format("truetype");
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }
  :root { --font-karla: "Karla", system-ui, sans-serif; }
  html, body { margin: 0; padding: 0; background: #0F0F10; font-family: var(--font-karla); color: #fff; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* High-res scale wrap. 328 × 160 × 3 = 984 × 480. Fits on 1080p easily. */
  .stage-wrap {
    transform: scale(3);
    transform-origin: center;
  }

  /* Recording HUD */
  .hud {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-family: var(--font-karla);
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    letter-spacing: 0.02em;
    text-align: center;
    pointer-events: auto;
  }
  .hud kbd {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.04);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: #fff;
    margin: 0 2px;
  }
  .hud .rec-btn {
    padding: 9px 14px;
    border-radius: 999px;
    background: #E14F12;
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    border: 0;
    cursor: pointer;
    transition: background 150ms;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .hud .rec-btn:hover { background: #ec5212; }
  .hud .rec-btn.recording { background: #444; pointer-events: none; }
  .hud .rec-btn .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
  }
  .hud .rec-btn.recording .dot { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .hud .hide-on-record { transition: opacity 200ms; }
  body.recording .hud .hide-on-record { opacity: 0; }
  body.recording .hud { background: transparent; }

  /* When recording via the in-browser MediaRecorder, hide HUD entirely */
  body.in-recording .hud { display: none; }
</style>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: "#111111",
          "yellow-ffe253": "#FFE253",
          "yellow-fff2b3": "#FFF2B3",
          "yellow-fffadd": "#FFFADD",
          "yellow-fbfbf3": "#FBFBF3",
          "yellow-fceb63": "#FCEB63",
          "gray-fafafa":  "#FAFAFA",
          "gray-f5f5f5":  "#F5F5F5",
          "green-cfff29": "#CFFF29",
          "green-92bc01": "#92BC01",
          "blue-4398ff":  "#4398FF",
        },
        fontFamily: { karla: ['Karla', 'system-ui', 'sans-serif'] },
        keyframes: {
          fadeInUp:   { "0%": { transform: "translateY(4px)", opacity: "0" }, "100%": { transform: "translateY(0)", opacity: "1" } },
          clickPress: { "0%": { transform: "scale(1)" }, "45%": { transform: "scale(0.86)" }, "100%": { transform: "scale(1)" } },
          targetPulse: { "0%": { transform: "scale(1)" }, "30%": { transform: "scale(1.18)" }, "55%": { transform: "scale(0.88)" }, "100%": { transform: "scale(1)" } },
        },
        animation: {
          "fade-in": "fadeInUp 320ms ease-out",
          "click-press": "clickPress 320ms cubic-bezier(0.34,1.56,0.64,1)",
          "target-pulse": "targetPulse 720ms cubic-bezier(0.34,1.56,0.64,1)",
        },
      }
    }
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#0F0F10">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#0F0F10"></rect>
      <g transform="translate(360, 280)">
        <rect width="480" height="216" rx="8" fill="#1A1A1A" stroke="#444" stroke-width="2"></rect>
        <circle cx="240" cy="108" r="44" fill="#E14F12"></circle>
        <polygon points="225,86 225,130 268,108" fill="#fff"></polygon>
      </g>
    </svg>
  </template>

  <div class="stage-wrap"><div id="root"></div></div>

  <div class="hud">
    <button id="rec-btn" class="rec-btn" title="Record one full loop as .webm">
      <span class="dot"></span>
      <span class="label">Record this loop (.webm)</span>
    </button>
    <div class="hide-on-record">
      Or use your OS recorder: <kbd>⌘</kbd><kbd>⇧</kbd><kbd>5</kbd> (macOS) · <kbd>Win</kbd><kbd>G</kbd> (Windows). The loop is 7.6s.
    </div>
  </div>

  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/ui-shims.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/icons.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="engage-aisee-v2/install-tutorial.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { InstallTutorial } = window;
    ReactDOM.createRoot(document.getElementById('root')).render(<InstallTutorial />);
  </script>

  <script>
    // ── In-page screen recorder. User clicks → picks this tab → records one
    //    7.6s loop → auto-stops → downloads .webm. (.webm converts to .mp4
    //    trivially in QuickTime, CloudConvert, ffmpeg, HandBrake.)
    const btn = document.getElementById('rec-btn');
    const label = btn.querySelector('.label');
    btn.addEventListener('click', async () => {
      if (!navigator.mediaDevices?.getDisplayMedia) {
        label.textContent = 'Screen capture not supported — use OS recorder';
        return;
      }
      btn.classList.add('recording');
      label.textContent = 'Recording… (pick THIS tab in the prompt)';
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 60 },
          audio: false,
        });
        document.body.classList.add('in-recording');
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
          ? 'video/webm;codecs=vp9'
          : 'video/webm';
        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
        const chunks = [];
        rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          document.body.classList.remove('in-recording');
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'aisee-install-tutorial.webm';
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          btn.classList.remove('recording');
          label.textContent = 'Record this loop (.webm)';
        };
        // Wait for the next phase-0 boundary so we capture a clean cycle.
        // Cycle = 2800 + 3000 + 1800 = 7600 ms.
        rec.start();
        setTimeout(() => rec.stop(), 7700);
      } catch (e) {
        document.body.classList.remove('in-recording');
        btn.classList.remove('recording');
        label.textContent = e.name === 'NotAllowedError' ? 'Permission denied — use OS recorder' : 'Recording failed';
      }
    });
  </script>
</body>
</html>
