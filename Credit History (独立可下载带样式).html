document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ns Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"daade4fd-903c-434b-8241-69716f87876f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ─── Base Color Tokens ─────────────────────────────────────── */\n:root {\n  /* Core */\n  --color-black:        #111111;\n  --color-white:        #FFFFFF;\n\n  /* Brand — Lime */\n  --color-lime:         #CFF229;\n  --color-lime-bright:  #C9FE12;\n  --color-lime-bg:      rgba(207, 255, 41, 0.5);\n\n  /* Brand — Yellow */\n  --color-yellow:       #FFE253;\n  --color-yellow-light: #FFF2B3;\n  --color-yellow-pale:  #FFFADD;\n\n  /* Brand — Orange (alerts, badges) */\n  --color-orange:       #EC5212;\n\n  /* Brand — Green (success) */\n  --color-green:        #A5D500;\n  --color-green-dark:   #92BC01;\n\n  /* Warm Cream (editor backgrounds) */\n  --color-cream:        #F7F6E9;\n\n  /* Grays */\n  --color-bg-page:      #F7F8F7;\n  --color-bg-card:      #FAFAFA;\n  --color-gray-100:     #F5F5F5;\n  --color-gray-200:     #E1E1E1;\n  --color-gray-300:     #D9D9D9;\n  --color-gray-400:     #C2C6CE;\n\n  /* Semantic transparency */\n  --color-muted:        rgba(17, 17, 17, 0.6);\n  --color-subtle:       rgba(17, 17, 17, 0.05);\n  --color-border:       rgba(17, 17, 17, 0.12);\n  --color-border-solid: #111111;\n\n  /* State colors */\n  --color-error-bg:     #FFD0D0;\n  --color-success-bg:   rgba(165, 213, 0, 0.15);\n\n  /* Shadows */\n  --shadow-dropdown:  0px 4px 6px -4px rgba(0,0,0,0.1), 0px 10px 15px -3px rgba(0,0,0,0.1);\n  --shadow-modal:     0px 8px 8px rgba(0,0,0,0.04), 0px 20px 24px rgba(0,0,0,0.1);\n  --shadow-card:      0px 1px 3px rgba(0,0,0,0.06);\n\n  /* Border Radii */\n  --radius-pill:      9999px;\n  --radius-btn:       8px;\n  --radius-card:      12px;\n  --radius-card-lg:   16px;\n  --radius-logo:      320px 320px 0px 0px;\n\n  /* Spacing (8px base) */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n\n  /* Layout */\n  --header-height:    70px;\n  --sidebar-width:    211px;\n  --page-padding:     48px;\n  --page-padding-sm:  16px;\n}\n\n/* ─── Semantic Color Aliases ─────────────────────────────────── */\n:root {\n  --fg-primary:       var(--color-black);\n  --fg-secondary:     var(--color-muted);\n  --fg-disabled:      var(--color-gray-400);\n\n  --bg-primary:       var(--color-white);\n  --bg-page:          var(--color-bg-page);\n  --bg-card:          var(--color-bg-card);\n  --bg-input:         var(--color-white);\n\n  --accent-primary:   var(--color-lime);\n  --accent-action:    var(--color-yellow);\n  --accent-alert:     var(--color-orange);\n  --accent-success:   var(--color-green);\n\n  --border-default:   var(--color-border);\n  --border-strong:    var(--color-border-solid);\n  --border-divider:   var(--color-gray-200);\n}\n\n/* ─── Base Typography Reset ──────────────────────────────────── */\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nbody {\n  font-family: 'Karla', sans-serif;\n  font-size: 14px;\n  font-weight: 400;\n  line-height: 1.57;\n  color: var(--fg-primary);\n  background-color: var(--bg-page);\n  margin: 0;\n}\n\n/* ─── Display / Heading (Gotu) ───────────────────────────────── */\n.display-hero {\n  font-family:'Karla',sans-serif;\n  font-size: 86px;\n  line-height: 1.0;\n  letter-spacing: -0.02em;\n  color: var(--fg-primary);\n}\n\n.display-xl {\n  font-family:'Karla',sans-serif;\n  font-size: 48px;\n  line-height: 1.1;\n  color: var(--fg-primary);\n}\n\n.display-lg {\n  font-family:'Karla',sans-serif;\n  font-size: 32px;\n  line-height: 1.25;\n  color: var(--fg-primary);\n}\n\n.display-md {\n  font-family:'Karla',sans-serif;\n  font-size: 24px;\n  line-height: 1.33;\n  color: var(--fg-primary);\n}\n\n.display-sm {\n  font-family:'Karla',sans-serif;\n  font-size: 18px;\n  line-height: 1.33;\n  color: var(--fg-primary);\n}\n\n/* Gotu base class */\n.font-gotu { font-family:'Karla',sans-serif; }\n\n/* ─── UI / Body (Karla) ──────────────────────────────────────── */\n.text-xl {\n  font-family: 'Karla', sans-serif;\n  font-size: 20px;\n  font-weight: 700;\n  line-height: 1.6;\n  letter-spacing: -0.01em;\n}\n\n.text-lg {\n  font-family: 'Karla', sans-serif;\n  font-size: 18px;\n  font-weight: 400;\n  line-height: 1.56;\n}\n\n.text-md {\n  font-family: 'Karla', sans-serif;\n  font-size: 16px;\n  font-weight: 400;\n  line-height: 1.5;\n}\n\n.text-base {\n  font-family: 'Karla', sans-serif;\n  font-size: 14px;\n  font-weight: 400;\n  line-height: 1.57;\n}\n\n.text-sm {\n  font-family: 'Karla', sans-serif;\n  font-size: 12px;\n  font-weight: 400;\n  line-height: 1.5;\n}\n\n.text-xs {\n  font-family: 'Karla', sans-serif;\n  font-size: 10px;\n  font-weight: 500;\n  line-height: 1.5;\n}\n\n.font-medium  { font-weight: 500; }\n.font-semibold{ font-weight: 600; }\n.font-bold    { font-weight: 700; }\n.text-muted   { color: var(--fg-secondary); }\n.text-center  { text-align: center; }\n\n/* ─── Mono (JetBrains Mono) ──────────────────────────────────── */\n.mono {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 12px;\n  font-weight: 400;\n  line-height: 1.5;\n}\n\n.mono-sm {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9px;\n  font-weight: 400;\n}\n\n.mono-bold {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 12px;\n  font-weight: 700;\n}\n\n/* ─── Semantic Element Styles ────────────────────────────────── */\nh1 { font-family:'Karla',sans-serif; font-size: 32px; font-weight: 400; line-height: 1.25; margin: 0 0 16px; }\nh2 { font-family:'Karla',sans-serif; font-size: 24px; font-weight: 400; line-height: 1.33; margin: 0 0 12px; }\nh3 { font-family:'Karla',sans-serif; font-size: 18px; font-weight: 400; line-height: 1.44; margin: 0 0 8px; }\nh4 { font-family: 'Karla', sans-serif; font-size: 16px; font-weight: 600; line-height: 1.5; margin: 0 0 8px; }\nh5 { font-family: 'Karla', sans-serif; font-size: 14px; font-weight: 600; line-height: 1.57; margin: 0; }\np  { font-family: 'Karla', sans-serif; font-size: 14px; font-weight: 400; line-height: 1.57; margin: 0 0 12px; }\n\ncode, pre {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 12px;\n  background: var(--color-cream);\n  border-radius: 4px;\n  padding: 2px 5px;\n}\n\na {\n  color: var(--fg-primary);\n  text-decoration: underline;\n}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════════\n   My Account — universal page across Analysis / Post / Engage\n   ═══════════════════════════════════════════════════════════════ */\n\n:root{\n  --lime:#CFF229;\n  --lime-bright:#C9FE12;\n  --lime-soft:#E8F8A3;\n  --lime-pale:#F5FBD0;\n  --yellow:#FFE253;\n  --yellow-soft:#FFF2B3;\n  --yellow-pale:#FFFADD;\n  --cream:#F7F6E9;\n  --warm:#FBFBF3;\n  --orange:#EC5212;\n  --orange-soft:#FFE9D9;\n  --purple:#A78BFA;\n  --black:#111111;\n  --muted:rgba(17,17,17,0.6);\n  --faint:rgba(17,17,17,0.4);\n  --border:rgba(17,17,17,0.06);\n  --border-strong:rgba(17,17,17,0.12);\n}\n\n*,*::before,*::after{box-sizing:border-box;}\nbody{margin:0;background:#F7F8F7;color:var(--black);font-family:'Karla',sans-serif;}\nbutton{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0;}\na{color:inherit;text-decoration:none;}\n\n/* ── App shell ─────────────────────────────────────────────── */\n.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}\n\n/* ── Header (sticky, spans across both columns) ────────────── */\n.header{\n  position:sticky;top:0;z-index:30;\n  grid-column:1 / -1;\n  height:70px;background:#fff;\n  display:flex;align-items:center;justify-content:space-between;\n  padding:0 28px;border-bottom:1px solid var(--border);\n}\n.brand{display:flex;align-items:center;gap:8px;}\n.brand-mark{\n  width:26px;height:27px;background:var(--lime);\n  border-radius:320px 320px 0 0;position:relative;\n}\n.brand-mark::after{\n  content:\"\";position:absolute;left:50%;top:55%;\n  width:14px;height:6px;background:var(--black);\n  border-radius:0 0 14px 14px;transform:translateX(-50%);\n}\n.brand-mark::before{\n  content:\"\";position:absolute;left:50%;top:42%;\n  width:5px;height:5px;background:var(--black);border-radius:50%;\n  transform:translate(-7px,0);box-shadow:5px 0 0 var(--black);\n}\n.brand-name{\n  font-family:'Karla';font-weight:700;font-size:22px;\n  letter-spacing:-0.02em;\n}\n.header-right{display:flex;align-items:center;gap:12px;}\n.icon-btn{\n  position:relative;width:36px;height:36px;border-radius:8px;\n  background:var(--yellow-pale);\n  display:inline-flex;align-items:center;justify-content:center;\n  transition:background .15s;\n}\n.icon-btn:hover{background:var(--yellow-soft);}\n.icon-btn .badge{\n  position:absolute;top:-4px;right:-4px;\n  background:var(--orange);color:#fff;\n  font-family:'JetBrains Mono',monospace;\n  font-size:10px;font-weight:600;\n  height:16px;min-width:18px;padding:0 4px;border-radius:9px;\n  display:inline-flex;align-items:center;justify-content:center;\n  border:2px solid #fff;\n}\n.header-engage{\n  display:flex;align-items:center;gap:14px;\n  font-size:14px;color:var(--muted);\n}\n.header-engage[hidden]{display:none;}\n#header-default[hidden]{display:none;}\n#header-default{display:flex;align-items:center;gap:12px;}\n.btn-new{\n  background:var(--yellow);color:var(--black);\n  height:36px;padding:0 14px;border-radius:8px;\n  font-weight:600;font-size:14px;\n  display:inline-flex;align-items:center;gap:6px;\n}\n.btn-new:hover{background:var(--yellow-soft);}\n\n/* ── Sidebar ───────────────────────────────────────────────── */\n.sidebar{\n  position:sticky;top:70px;align-self:start;\n  width:240px;height:calc(100vh - 70px);\n  background:#fff;border-right:1px solid var(--border);\n  padding:16px 12px 12px;display:flex;flex-direction:column;\n}\n\n/* Mode switcher (Analysis / Post / Engage) */\n.mode-switch{\n  display:grid;grid-template-columns:repeat(3,1fr);gap:2px;\n  background:rgba(17,17,17,0.04);border-radius:10px;padding:4px;\n  margin-bottom:18px;\n}\n.mode-btn{\n  height:36px;border-radius:7px;\n  display:inline-flex;align-items:center;justify-content:center;gap:6px;\n  font-size:13px;font-weight:500;color:var(--muted);\n  transition:all .15s;padding:0 4px;\n}\n.mode-btn svg{width:15px;height:15px;flex-shrink:0;}\n.mode-btn span{\n  font-size:13px;letter-spacing:-0.01em;\n  max-width:0;overflow:hidden;transition:max-width .2s;\n}\n.mode-btn.active{\n  background:var(--yellow);color:var(--black);font-weight:600;\n  box-shadow:0 1px 2px rgba(17,17,17,0.06);\n}\n.mode-btn.active span{max-width:80px;margin-left:2px;}\n\n/* Section that swaps per mode */\n.side-panel{flex:1;overflow-y:auto;display:flex;flex-direction:column;}\n.side-panel[hidden]{display:none;}\n\n/* — Analysis sidebar — */\n.btn-new-analysis{\n  width:100%;height:42px;border-radius:10px;\n  background:var(--lime);color:var(--black);\n  font-weight:600;font-size:14px;\n  display:flex;align-items:center;justify-content:center;gap:8px;\n  margin-bottom:14px;\n  transition:background .15s;\n}\n.btn-new-analysis:hover{background:var(--lime-bright);}\n.analysis-list{display:flex;flex-direction:column;gap:2px;}\n.analysis-item{\n  display:flex;align-items:center;gap:10px;\n  padding:8px 10px;border-radius:8px;\n  font-size:14px;color:var(--black);\n  transition:background .15s;\n}\n.analysis-item:hover{background:var(--yellow-pale);}\n.analysis-item .ai-icon{\n  width:24px;height:24px;border-radius:6px;flex-shrink:0;\n  display:inline-flex;align-items:center;justify-content:center;\n  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#fff;\n}\n.analysis-item .ai-name{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n.analysis-item .ai-status{\n  font-family:'JetBrains Mono',monospace;font-size:9px;\n  background:var(--orange-soft);color:var(--orange);\n  padding:2px 6px;border-radius:999px;font-weight:600;\n}\n.analysis-item .chev{color:var(--faint);}\n\n/* — Post sidebar — */\n.post-nav{display:flex;flex-direction:column;gap:2px;}\n.post-nav-item{\n  display:flex;align-items:center;gap:10px;\n  height:40px;padding:0 12px;border-radius:8px;\n  font-size:14px;color:var(--black);\n  transition:background .15s;\n}\n.post-nav-item svg{width:16px;height:16px;}\n.post-nav-item:hover{background:var(--yellow-pale);}\n.post-nav-item.active{background:var(--yellow);font-weight:600;}\n\n/* — Engage sidebar — */\n.engage-tag{\n  font-family:'JetBrains Mono',monospace;font-size:10px;\n  color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;\n  padding:8px 10px 6px;\n}\n.engage-kw{\n  display:flex;align-items:center;gap:8px;\n  padding:8px 10px;border-radius:8px;\n  font-size:13.5px;transition:background .15s;\n}\n.engage-kw:hover{background:var(--yellow-pale);}\n.engage-kw .dot{width:6px;height:6px;border-radius:50%;background:var(--lime);}\n.engage-kw .dot.orange{background:var(--orange);}\n.engage-kw .kw-count{\n  margin-left:auto;font-family:'JetBrains Mono',monospace;\n  font-size:11px;color:var(--muted);\n}\n\n/* Active state on sidebar — link to \"My Account\" */\n.side-active-pill{\n  display:inline-flex;align-items:center;gap:6px;\n  padding:5px 10px;background:var(--lime-soft);\n  border-radius:999px;font-size:11px;font-weight:600;\n  font-family:'JetBrains Mono',monospace;letter-spacing:0.04em;\n  text-transform:uppercase;color:#3D5E00;\n  width:fit-content;margin:0 8px 14px;\n}\n.side-active-pill::before{\n  content:\"\";width:6px;height:6px;border-radius:50%;background:var(--lime-bright);\n}\n\n/* Account card at sidebar bottom */\n.acct-card{\n  margin-top:auto;padding:12px;border-radius:12px;\n  background:#FAFAFA;border:1px solid var(--border);\n  display:flex;flex-direction:column;gap:10px;\n}\n.acct-row{display:flex;align-items:center;gap:10px;}\n.acct-avatar{\n  width:32px;height:32px;border-radius:50%;background:var(--cream);\n  display:inline-flex;align-items:center;justify-content:center;\n  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;\n  border:1px solid var(--border);\n}\n.acct-info{flex:1;min-width:0;}\n.acct-email{\n  font-size:12.5px;font-weight:500;\n  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n}\n.acct-plan{font-size:11px;color:var(--muted);}\n.acct-credits{\n  display:flex;align-items:center;justify-content:space-between;\n  font-size:12px;font-family:'JetBrains Mono',monospace;\n}\n.acct-credits .info{\n  width:14px;height:14px;border-radius:50%;\n  background:rgba(17,17,17,0.08);color:var(--muted);\n  display:inline-flex;align-items:center;justify-content:center;\n  font-size:10px;font-weight:700;\n}\n.acct-bar{height:5px;border-radius:3px;background:rgba(17,17,17,0.06);overflow:hidden;display:flex;}\n.acct-bar .seg{height:100%;}\n.acct-bar .seg.sub{background:var(--lime-bright);}\n.acct-bar .seg.top{background:var(--purple);}\n.btn-logout{\n  width:100%;height:36px;border-radius:8px;\n  background:#fff;border:1px solid var(--border-strong);\n  font-size:13px;font-weight:500;\n  display:flex;align-items:center;justify-content:center;gap:6px;\n}\n.btn-logout:hover{background:var(--yellow-pale);}\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════════\n   My Account — main content (account header + plans)\n   ═══════════════════════════════════════════════════════════════ */\n\n.main{padding:32px 40px 80px;}\n\n/* ── My Account header row ─────────────────────────────────── */\n.account-head{\n  display:flex;align-items:center;justify-content:space-between;\n  margin-bottom:24px;\n}\n.account-title{\n  display:inline-block;\n  font-family:'Karla',sans-serif;font-size:32px;line-height:1;\n  background:var(--lime-pale);padding:8px 18px;border-radius:8px;\n}\n.account-head .btn-credit-details{\n  background:#fff;border:1px solid var(--border-strong);\n  height:38px;padding:0 16px;border-radius:8px;\n  font-size:13px;font-weight:500;\n}\n.account-head .btn-credit-details:hover{background:var(--yellow-pale);}\n\n/* ── Plan summary row (Current Plan + Remaining Credits) ──── */\n.summary{\n  display:grid;grid-template-columns:1fr 1fr;gap:16px;\n  margin-bottom:28px;\n}\n.summary-card{\n  background:var(--lime-pale);border-radius:14px;\n  padding:22px 24px;position:relative;overflow:hidden;\n}\n.summary-card.credits{background:#FAFAFA;}\n\n.card-head{\n  display:flex;align-items:center;justify-content:space-between;\n  margin-bottom:14px;\n}\n.card-head .lbl{font-size:14px;color:var(--muted);}\n.card-head .btn-manage{\n  background:transparent;border:1px solid var(--border-strong);\n  height:32px;padding:0 14px;border-radius:8px;\n  font-size:12.5px;font-weight:500;\n  display:inline-flex;align-items:center;\n}\n.card-head .btn-manage:hover{background:#fff;}\n.card-head .btn-manage.upgrade{\n  background:var(--black);color:#fff;border-color:var(--black);\n}\n.card-head .btn-manage.upgrade:hover{background:#000;}\n.card-head .btn-purchase{\n  background:var(--black);color:#fff;\n  height:32px;padding:0 16px;border-radius:8px;\n  font-size:12.5px;font-weight:500;\n}\n.card-head .btn-purchase:hover{background:#000;}\n\n.plan-name{\n  display:flex;align-items:baseline;gap:14px;\n  margin-bottom:18px;\n}\n.plan-name h3{\n  font-family:'Karla',sans-serif;font-size:30px;line-height:1;margin:0;\n}\n.plan-name .next{\n  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);\n  background:rgba(17,17,17,0.05);padding:4px 8px;border-radius:6px;\n}\n\n/* Subscription credits row — headline */\n.sub-credits{\n  padding:14px 16px;background:rgba(255,255,255,0.6);\n  border:1px solid rgba(17,17,17,0.06);border-radius:10px;\n  margin-bottom:14px;\n}\n.sub-credits-row{\n  display:flex;align-items:baseline;gap:10px;\n}\n.sub-credits-row .spark{\n  width:20px;height:20px;color:var(--lime-bright);\n  align-self:center;\n}\n.sub-credits-row .num{\n  font-family:'Karla',sans-serif;font-size:28px;line-height:1;\n}\n.sub-credits-row .sub-lbl{\n  font-size:12.5px;color:var(--muted);\n}\n.sub-credits-meta{\n  margin-top:6px;font-size:11px;color:var(--muted);\n  font-family:'JetBrains Mono',monospace;letter-spacing:0.02em;\n}\n\n/* Module-grouped quotas */\n.plan-quotas{\n  display:grid;grid-template-columns:1fr auto 1fr;gap:0;\n  background:rgba(255,255,255,0.5);\n  border-radius:10px;padding:14px 8px;\n}\n.quota-col{padding:0 14px;}\n.quota-divider{width:1px;background:rgba(17,17,17,0.08);margin:4px 0;}\n.quota-mod{\n  font-family:'JetBrains Mono',monospace;font-size:10px;\n  letter-spacing:0.08em;font-weight:600;margin-bottom:10px;\n}\n.quota-mod.engage{color:var(--c-engage-strong);}\n.quota-mod.post{color:#6B4FE6;}\n.quota-list{display:flex;flex-direction:column;gap:7px;}\n.q{\n  display:flex;align-items:baseline;justify-content:space-between;\n  font-size:13px;color:var(--black);\n}\n.q .q-lbl{color:var(--muted);}\n.q .q-val{\n  font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;\n}\n.q .q-val small{color:var(--muted);font-weight:400;font-size:11px;}\n.q .q-val.muted{color:var(--faint);}\n\n/* Credits side */\n.credits-amount{\n  display:flex;align-items:center;gap:10px;\n  font-family:'Karla',sans-serif;font-size:36px;line-height:1;\n  margin-bottom:20px;\n}\n.credits-amount .spark{\n  width:30px;height:30px;color:var(--lime-bright);\n}\n.credits-amount small{\n  font-family:'Karla';font-size:14px;color:var(--muted);font-weight:400;\n}\n.credits-bar{\n  height:8px;border-radius:5px;background:rgba(17,17,17,0.06);\n  overflow:hidden;display:flex;margin-bottom:10px;\n}\n.credits-bar .seg.sub{background:var(--lime-bright);}\n.credits-bar .seg.top{background:var(--purple);}\n.credits-legend{\n  display:flex;justify-content:flex-end;gap:18px;\n  font-size:12px;color:var(--muted);\n}\n.credits-legend .item{display:inline-flex;align-items:center;gap:6px;}\n.credits-legend .dot{width:7px;height:7px;border-radius:50%;}\n.credits-legend .dot.sub{background:var(--lime-bright);}\n.credits-legend .dot.top{background:var(--purple);}\n\n/* ── Plans / Credits subtabs ───────────────────────────────── */\n.subtabs{\n  display:flex;gap:24px;border-bottom:1px solid var(--border);\n  margin-bottom:48px;\n}\n.subtab{\n  padding:14px 4px;font-size:15px;font-weight:500;color:var(--muted);\n  position:relative;transition:color .15s;\n}\n.subtab:hover{color:var(--black);}\n.subtab.active{color:var(--black);font-weight:600;}\n.subtab.active::after{\n  content:\"\";position:absolute;left:0;right:0;bottom:-1px;\n  height:2px;background:var(--black);border-radius:1px;\n}\n\n/* ── Upgrade header ────────────────────────────────────────── */\n.upgrade-head{text-align:center;margin-bottom:36px;}\n.upgrade-head h1{\n  font-family:'Karla',sans-serif;font-size:48px;line-height:1;\n  margin:0 0 16px;\n}\n.upgrade-head p{\n  max-width:820px;margin:0 auto;font-size:14.5px;line-height:1.7;\n  color:var(--muted);\n}\n\n.bill-toggle{\n  display:inline-flex;align-items:center;gap:2px;\n  background:#fff;border:1px solid var(--border);\n  border-radius:999px;padding:4px;margin:24px auto 0;\n}\n.bill-toggle button{\n  padding:8px 18px;border-radius:999px;font-size:14px;font-weight:500;\n  color:var(--muted);display:inline-flex;align-items:center;gap:8px;\n}\n.bill-toggle button.active{background:var(--lime-bright);color:var(--black);}\n.bill-toggle .save{\n  font-size:10.5px;background:var(--yellow-pale);color:var(--black);\n  padding:2px 7px;border-radius:999px;font-family:'JetBrains Mono',monospace;\n  font-weight:600;\n}\n\n/* ── Plan cards grid ───────────────────────────────────────── */\n.plans-grid{\n  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;\n  margin-top:32px;align-items:stretch;\n}\n.plan-card{\n  background:#FA e{background:#E9E9E9;}\n.plan-cta.upgrade:hover{background:#DDD;}\n.plan-cta.primary{background:var(--black);color:#fff;}\n.plan-cta.primary:hover{background:#000;}\n\n.feat-section{padding-top:4px;}\n.feat-cat-label{\n  font-family:'Karla';font-size:11px;font-weight:600;\n  color:var(--orange);text-transform:uppercase;letter-spacing:0.06em;\n  margin:14px 0 10px;\n}\n.feat-cat-label.first{margin-top:0;}\n.feat-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}\n.feat-list li{\n  display:flex;align-items:flex-start;gap:8px;\n  font-size:13.5px;line-height:1.45;\n}\n.feat-list .ck{\n  width:16px;height:16px;border-radius:4px;background:var(--lime-bright);\n  display:inline-flex;align-items:center;justify-content:center;\n  flex-shrink:0;margin-top:2px;\n}\n.feat-list .ck.dash{background:transparent;color:var(--faint);font-weight:700;}\n.feat-list .ck svg{width:10px;height:10px;}\n.feat-list li .meta{\n  margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;\n  background:rgba(17,17,17,0.05);color:var(--muted);\n  padding:2px 7px;border-radius:6px;\n  white-space:nowrap;\n  align-self:center;\n}\n.feat-list li .meta.max{background:var(--orange-soft);color:var(--orange);font-weight:600;}\n.feat-list li .meta.trial{background:#FFE5E0;color:var(--orange);font-weight:600;}\n.feat-list li .meta.unlimited{background:rgba(17,17,17,0.05);color:var(--muted);}\n.feat-list li .meta.next-tier{background:transparent;color:var(--faint);font-style:italic;}\n\n.feat-models{display:inline-flex;align-items:center;gap:3px;margin-left:4px;}\n.feat-models .m{\n  width:14px;height:14px;border-radius:50%;background:#ddd;\n  display:inline-flex;align-items:center;justify-content:center;\n  font-size:8px;color:#fff;font-weight:700;font-family:'JetBrains Mono',monospace;\n}\n.feat-models .m.gpt{background:#0EA46F;}\n.feat-models .m.gem{background:#4285F4;}\n.feat-models .m.grk{background:#111;}\n.feat-models .m.ppx{background:#20808D;}\n\n/* /\n.cu-v3{\n  background:#fff;border:1px solid var(--border);\n  border-radius:14px;padding:20px 24px;margin-bottom:42px;\n}\n.cu-v3 .head{\n  display:flex;align-items:flex-end;justify-content:space-between;\n  margin-bottom:18px;gap:16px;flex-wrap:wrap;\n}\n.cu-v3 .head .left .ttl-row{\n  display:flex;align-items:baseline;gap:10px;margin-bottom:6px;\n}\n.cu-v3 .head .left h2{\n  font-family:'Karla',sans-serif;font-size:20px;line-height:1;margin:0;\n}\n.cu-v3 .head .left .dates{\n  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);\n}\n.cu-v3 .head .left .big{\n  display:flex;align-items:baseline;gap:6px;\n}\n.cu-v3 .head .left .big .spark{width:22px;height:22px;color:var(--lime-bright);align-self:center;}\n.cu-v3 .head .left .big .n{font-family:'Karla',sans-serif;font-size:30px;line-height:1;}\n.cu-v3 .head .left .big .of{font-family:'Karla';font-size:13px;color:var(--muted);margin-left:4px;}\n.cu-v3 .head .left .big .of b{color:var(--black);font-family:'JetBrains Mono',monospace;font-weight:600;}\n\n.cu-v3 .head .right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}\n.cu-v3 .head .right .rate-chip{\n  display:inline-flex;align-items:center;gap:6px;\n  background:var(--lime-soft);color:#3D5E00;\n  font-family:'Karla';font-size:12px;font-weight:600;\n  padding:6px 12px;border-radius:999px;\n}\n.cu-v3 .head .right .rate-chip .ico{width:14px;height:14px;}\n.cu-v3 .head .right .rate-chip.warn{background:#FFE5DD;color:var(--orange);}\n.btn-history-v3{\n  background:transparent;border:0;color:var(--muted);\n  font-family:'Karla';font-size:13px;cursor:pointer;\n  display:inline-flex;align-items:center;gap:6px;\n  padding:0;\n}\n.btn-history-v3:hover{color:var(--black);}\n.btn-history-v3 svg{width:13px;height:13px;}\n\n.cu-v3 .tiles{\n  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;\n}\n.cu-v3 .tile{\n  border-radius:12px;padding:16px 18px;\n  display:flex;flex-direction:column;gap:12px;\n}\n.cu-v3 .tile.analysis{background:var(--lime-pale);}\n.cu-v3 .tile.post{background:#FFF7CD;}\n.cu-v3 .tile.engage{background:#F1ECFE;}\n\n.cu-v3 .tile-head{\n  display:flex;align-items:center;justify-content:space-between;\n}\n.cu-v3 .tile-head .mod{\n  display:inline-flex;align-items:center;gap:7px;\n  font-family:'Karla';font-size:13px;font-weight:700;\n}\n.cu-v3 .tile-head .mod-ic{\n  width:24px;height:24px;border-radius:6px;background:#fff;\n  display:inline-flex;align-items:center;justify-content:center;\n}\n.cu-v3 .tile.analysis .mod{color:#3D5E00;}\n.cu-v3 .tile.post .mod{color:#7A5A00;}\n.cu-v3 .tile.engage .mod{color:#3D1F8A;}\n\n.cu-v3 .tile-pct{\n  font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);\n}\n.cu-v3 .tile-pct b{color:var(--black);font-weight:700;}\n\n/* Tile main: credits used (the main \"consumption\" metric) */\n.cu-v3 .tile-main{\n  display:flex;align-items:baseline;gap:6px;\n}\n.cu-v3 .tile-main .spark{width:18px;height:18px;align-self:center;}\n.cu-v3 .tile.analysis .tile-main .spark{color:#3D5E00;}\n.cu-v3 .tile.post .tile-main .spark{color:#7A5A00;}\n.cu-v3 .tile.engage .tile-main .spark{color:#3D1F8A;}\n.cu-v3 .tile-main .num{\n  font-family:'Karla',sans-serif;font-size:24px;line-height:1;\n}\n.cu-v3 .tile-main .unit{\n  font-family:'Karla';font-size:12px;color:var(--muted);\n}\n\n/* Tile activity rows (consistent: 2 rows per tile, fix #8) */\n/* Inline plan quotas inside each tile (no secondary page) */\n.tile-quotas{\n  display:flex;flex-direction:column;\n  padding-top:12px;border-top:1px dashed rgba(17,17,17,0.12);\n  gap:9px;\n}\n.quota-row{\n  display:grid;grid-template-columns:1fr 60px 50px;\n  gap:10px;align-items:center;\n  font-size:12.5px;\n}\n.quota-row .k{color:var(--muted);}\n.quota-row .v{\n  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--black);\n  text-align:right;font-weight:600;\n}\n.quota-row .v small{color:var(--muted);font-weight:400;}\n.quota-bar{\n  height:4px;border-radius:3px;background:rgba(17,17 \n    if (i % 5 === 0 || i === days - 1) {\n      const raw = startDay + i;\n      s.textContent = raw <= daysInStart\n        ? `${startMonth} ${raw}`\n        : `Nov ${raw - daysInStart}`;\n    }\n    axis.appendChild(s);\n  }\n\n  // Filter chips toggle (visual only)\n  document.querySelectorAll('.ch-chip').forEach(c => c.addEventListener('click', () => {\n    document.querySelectorAll('.ch-chip').forEach(x => x.classList.remove('active'));\n    c.classList.add('active');\n  }));\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
