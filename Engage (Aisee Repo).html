<!-- Karla — local TTF served from the project; matches aisee-agent's localFont -->
<style>
  @font-face {
    font-family: "Karla";
    src: url("fonts/Karla-VariableFont_wght.ttf") format("truetype");
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --font-karla: "Karla", system-ui, sans-serif;
    --font-gotu:  "Karla", system-ui, sans-serif;
  }
  html, body { background: #FAFAFA; }
  body { font-family: var(--font-karla); }
  /* Lightweight scrollbar — matches feel of the real app */
  ::-webkit-scrollbar       { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(17,17,17,0.12); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,0.22); border: 2px solid transparent; background-clip: content-box; }

  /* ── Filter bar responsive behavior ─────────────────────────────────────
     The row carries 4 filter chips + a sync block. As container width drops,
     progressively strip non-essential labels (Next in → Last sync prefix) so
     the chips never have to wrap onto a second line. Chips themselves become
     horizontally scrollable as a last-ditch fallback at very narrow widths. */
  .fb-chips { scrollbar-width: none; }
  .fb-chips::-webkit-scrollbar { display: none; }
  .fb-chips > * { flex: 0 0 auto; }

  /* below 900px: drop "Next in 23h 58m" and the "SORT BY" prefix */
  @container (max-width: 900px) {
    .fb-wrap .fb-sync-next { display: none; }
    .fb-wrap .fb-sort-prefix { display: none; }
  }
  /* below 760px: drop the "Last sync" label, keep "2m ago" */
  @container (max-width: 760px) { .fb-wrap .fb-sync-label { display: none; } }
  /* below 640px: drop the entire sync block (status pulse stays on the platform menu badge) */
  @container (max-width: 640px) { .fb-wrap .fb-sync { display: none; } }
</style>

<!-- Tailwind via Play CDN. Custom colour scale matches the repo's globals.css. -->

          "red-ec5212": "#EC5212",
          "red-e14f12": "#E14F12",
          "red-fdebe4": "#FDEBE4",
          "purple-fae2fe": "#FAE2FE",

        },
        fontFamily: {
          karla: ['Karla', 'system-ui', 'sans-serif'],
          gotu:  ['Karla', 'system-ui', 'sans-serif'],
        },
        keyframes: {
          bounce: {
            "0%, 100%": { transform: "translateY(0)", opacity: "0.3" },
            "50%":      { transform: "translateY(-2px)", opacity: "1" },
          },
          fadeInUp: {
            "0%": { transform: "translateY(4px)", opacity: "0" },
            "100%": { transform: "translateY(0)", opacity: "1" },
          },
          clickPress: {
            "0%":   { transform: "scale(1)" },
            "45%":  { transform: "scale(0.86)" },
            "100%": { transform: "scale(1)" },
          },
          targetPulse: {
            "0%":   { transform: "scale(1)" },
            "30%":  { transform: "scale(1.18)" },
            "55%":  { transform: "scale(0.88)" },
            "100%": { transform: "scale(1)" },
          },
        },
        animation: {
          "fade-in": "fadeInUp 320ms ease-out",
          "click-press": "clickPress 320ms cubic-bezier(0.34,1.56,0.64,1)",
          "target-pulse": "targetPulse 720ms cubic-bezier(0.34,1.56,0.64,1)",
        },
      }
    }
  };
</script>
