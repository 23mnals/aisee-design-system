<!doctype html>
<!-- @dsCard group="Brand" name="Tracking Eye" subtitle="aisee character peeks out of eye, scans sources" viewport="1200x800" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Engage — Tracking</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-page);
    font-family: 'Karla', sans-serif;
    color: var(--fg-primary);
  }

  /* ─── Header (matches engage-aisee Header) ──────────────── */
  .hdr {
    position: fixed;
    inset: 0 0 auto 0;
    height: 70px;
    background: #fff;
    border-bottom: 1px solid rgba(17,17,17,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 20;
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-dome {
    width: 26px; height: 26px;
    background: var(--color-lime);
    border-radius: 9999px 9999px 0 0;
  }
  .logo-text {
    font-family: 'Karla', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .hdr-right { display: flex; align-items: center; gap: 16px; }
  .bell-btn {
    position: relative;
    width: 36px; height: 36px;
    background: var(--color-yellow-pale);
    border: none;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--color-black);
  }
  .bell-btn:hover { background: var(--color-yellow-light); }
  .bell-btn .dot {
    position: absolute;
    top: 6px; right: 6px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--color-orange);
    box-shadow: 0 0 0 2px #fff;
  }
  .new-btn {
    height: 32px;
    padding: 0 10px;
    background: var(--color-yellow);
    border: none;
    border-radius: 8px;
    font-family: 'Karla', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--color-black);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .new-btn:hover { filter: brightness(0.97); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #E1E1E1;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }

  /* ─── Main canvas ────────────────────────────────────────── */
  main {
    padding-top: 70px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tracker {
    width: 100%;
    max-width: 520px;
    padding: 32px 24px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    text-align: center;
  }

  /* ─── The eye icon ───────────────────────────────────────── */
  /* Geometry is 1:1 with uploads/005-2f987abd.svg (viewBox 80×56):
     ‑ Black ellipse outer frame
     ‑ Yellow aisee dome (rounded-top) peeking inside
     ‑ A small horizontal almond / lemon eye on the dome (white sclera)
     ‑ A black rounded-square pupil inside that tracks left-right
     ‑ A yellow lid drops over the eye area to blink. */
  .eye {
    position: relative;
    width: 160px;
    height: 112px;
    animation: float 4.6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  .eye-svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* The black pupil-square tracks horizontally inside the white almond.
     Almond spans x≈27 to x≈53 (width 26); pupil width 11.77, so the centre
     can travel about ±7 SVG units before reaching the almond corners. */
  .pupil {
    transform-box: fill-box;
    transform-origin: center;
    animation: pupilTrack 6.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }
  @keyframes pupilTrack {
    0%        { transform: translate(    0,      0); }
    14%, 28%  { transform: translate(-6.5px,  0.6px); }
    50%       { transform: translate( 1.5px, -0.6px); }
    64%, 78%  { transform: translate( 6.5px,  0.6px); }
    92%       { transform: translate(-1.8px, -0.6px); }
    100%      { transform: translate(    0,      0); }
  }

  /* Blink: a yellow lid drops over the eye almond area */
  .lid {
    transform-box: fill-box;
    transform-origin: center top;
    transform: scaleY(0);
    animation: blink 5.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 86%, 100% { transform: scaleY(0); }
    90%, 93%      { transform: scaleY(1); }
    96%           { transform: scaleY(0); }
  }

  /* ─── Tracking copy ──────────────────────────────────────── */
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 1px;
    font-family: 'Karla', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--color-black);
  }
  .ellipsis span {
    display: inline-block;
    opacity: 0;
    animation: dots 1.6s ease-in-out infinite;
  }
  .ellipsis span:nth-child(1) { animation-delay: 0.0s; }
  .ellipsis span:nth-child(2) { animation-delay: 0.2s; }
  .ellipsis span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dots {
    0%, 60%, 100% { opacity: 0; }
    20%, 50%      { opacity: 1; }
  }

  .subtitle {
    font-size: 13px;
    color: var(--color-muted);
    line-height: 1.6;
    max-width: 360px;
  }

  /* ─── Sources strip ──────────────────────────────────────── */
  .sources {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 4px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 11px;
    background: #fff;
    border: 1px solid rgba(17,17,17,0.06);
    border-radius: 9999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--color-black);
    transition: border-color 0.3s, background 0.3s;
  }
  .pill .ind {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(17,17,17,0.18);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .pill.scanning {
    border-color: rgba(17,17,17,0.18);
    background: var(--color-yellow-pale);
  }
  .pill.scanning .ind {
    background: var(--color-lime);
    box-shadow: 0 0 0 3px rgba(207, 242, 41, 0.35);
  }
  .pill.done {
    background: #fff;
  }
  .pill.done .ind {
    background: var(--color-green);
  }
  .pill .count {
    color: var(--color-muted);
    margin-left: 2px;
  }

  /* ─── Progress bar ───────────────────────────────────────── */
  .bar {
    width: 100%;
    max-width: 320px;
    height: 4px;
    background: rgba(17,17,17,0.06);
    border-radius: 9999px;
    overflow: hidden;
    margin-top: 4px;
  }
  .bar-fill {
    height: 100%;
    width: 22%;
    background: var(--color-lime);
    border-radius: inherit;
    animation: sweep 2.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }
  @keyframes sweep {
    0%   { margin-left: -25%; width: 22%; }
    60%  { margin-left: 80%;  width: 35%; }
    100% { margin-left: 105%; width: 22%; }
  }

  /* ─── Mono status line ──────────────────────────────────── */
  .status {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(17,17,17,0.45);
    letter-spacing: 0.02em;
    height: 14px;
  }
  .status .blink-cursor {
    display: inline-block;
    width: 6px;
    height: 10px;
    background: var(--color-black);
    vertical-align: -1px;
    margin-left: 2px;
    animation: cur 1s steps(2) infinite;
  }
  @keyframes cur { 50% { opacity: 0; } }

  /* ─── Cancel link ────────────────────────────────────────── */
  .cancel {
    margin-top: 16px;
    background: transparent;
    border: none;
    font-family: 'Karla', sans-serif;
    font-size: 13px;
    color: var(--color-muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .cancel:hover { color: var(--color-black); }
</style>
</head>
<body>

  <!-- Header (matches engage-aisee) -->
  <header class="hdr">
    <div class="logo">
      <div class="logo-dome"></div>
      <span class="logo-text">aisee</span>
    </div>
    <div class="hdr-right">
      <button class="bell-btn" aria-label="Notifications">
        <!-- Lucide Bell -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
        <span class="dot"></span>
      </button>
      <button class="new-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14"/><path d="M5 12h14"/>
        </svg>
        New
      </button>
      <div class="avatar">G</div>
    </div>
  </header>

  <main>
    <div class="tracker">

      <!-- ▒▒ Animated icon ▒▒  Geometry from uploads/005-2f987abd.svg -->
      <div class="eye" aria-hidden="true">
        <svg class="eye-svg" viewBox="0 0 80 56" style="height: 56px;">
          <defs>
            <!-- Clip everything to the outer black ellipse -->
            <clipPath id="outerClip">
              <ellipse cx="39.76" cy="28" rx="39.76" ry="28"/>
            </clipPath>
            <!-- Eye area = horizontal rect ∩ almond path (lemon shape) -->
            <clipPath id="eyeRectClip">
              <rect x="27.0015" y="18.5996" width="26.2682" height="11.6658"/>
            </clipPath>
            <clipPath id="eyeAlmondClip">
              <path d="M27.0015 24.4125
                       C35.7612 16.662 44.5209 16.662 53.2806 24.4125
                       C44.5209 32.163 35.7612 32.163 27.0015 24.4125 Z"/>
            </clipPath>
            <!-- Dome shape — clips the blink lid so its corners can’t poke
                 outside the yellow dome into the surrounding black area. -->
            <clipPath id="domeClip">
              <path d="M17.0737 32.0633
                       C17.0737 19.3258 27.3995 9 40.137 9
                       C52.8745 9 63.2003 19.3258 63.2003 32.0633
                       V57 H17.0737 Z"/>
            </clipPath>
          </defs>

          <!-- Black outer ellipse -->
          <ellipse cx="39.76" cy="28" rx="39.76" ry="28" fill="#111111"/>

          <g clip-path="url(#outerClip)">
            <!-- Yellow aisee dome (rounded top, flat bottom) -->
            <path
              d="M17.0737 32.0633
                 C17.0737 19.3258 27.3995 9 40.137 9
                 C52.8745 9 63.2003 19.3258 63.2003 32.0633
                 V57 H17.0737 Z"
              fill="#FFE253"/>

            <!-- Eye area: white sclera + tracking pupil, clipped to almond ∩ rect -->
            <g clip-path="url(#eyeRectClip)">
              <g clip-path="url(#eyeAlmondClip)">
                <!-- White sclera (rect, clipped to almond shape) -->
                <rect x="27.0015" y="18.5996"
                      width="26.2682" height="11.6658" fill="#FFFFFF"/>
                <!-- Black pupil — rounded square reading as a circle -->
                <rect class="pupil"
                      x="34.3008" y="14.6548"
                      width="11.7675" height="11.6658"
                      rx="5.83288" fill="#111111"/>
              </g>
            </g>

            <!-- Blink lid: a yellow rectangle that drops over the eye area,
                 clipped to the dome so its corners stay inside the yellow. -->
            <g clip-path="url(#domeClip)">
              <rect class="lid" x="27" y="16" width="26.27" height="15" fill="#FFE253"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- Title -->
      <div>
        <div class="title-row">
          <span>Tracking</span>
          <span class="ellipsis"><span>.</span><span>.</span><span>.</span></span>
        </div>
        <div class="subtitle" style="margin-top: 8px;">
          Scanning your keywords, subreddits and tracked accounts.<br/>
          New matches will land in your Signal Feed.
        </div>
      </div>

      <!-- Sources -->
      <div class="sources" id="sources">
        <span class="pill" data-i="0">
          <span class="ind"></span>
          <span>keywords</span>
          <span class="count">14</span>
        </span>
        <span class="pill" data-i="1">
          <span class="ind"></span>
          <span>subreddits</span>
          <span class="count">9</span>
        </span>
        <span class="pill" data-i="2">
          <span class="ind"></span>
          <span>accounts</span>
          <span class="count">23</span>
        </span>
      </div>

      <!-- Progress -->
      <div class="bar"><div class="bar-fill"></div></div>

      <!-- Mono live status -->
      <div class="status" id="status">scanning r/<span id="src">defi</span><span class="blink-cursor"></span></div>

      <button class="cancel" id="cancel">Cancel tracking</button>
    </div>
  </main>

<script>
  // Rotate through the three "sources" — only one scanning at a time,
  // previous one flips to "done". This pairs with the eye sweep.
  const pills = [...document.querySelectorAll('.pill')];
  const srcEl = document.getElementById('src');
  const subs = ['defi', 'web3marketing', 'cryptocurrency', 'ethfinance', 'nfts'];
  const kws  = ['"airdrop"', '"L2 fees"', '"smart wallet"', '"restaking"'];
  const accs = ['@vitalikbuterin', '@cdixon', '@punk6529', '@sassal0x'];

  const pools = [kws, subs, accs];
  let active = 0;

  function tick() {
    pills.forEach((p, i) => {
      p.classList.remove('scanning', 'done');
      if (i < active)       p.classList.add('done');
      else if (i === active) p.classList.add('scanning');
    });
    const pool = pools[active];
    srcEl.textContent = pool[Math.floor(Math.random() * pool.length)];
    active = (active + 1) % (pills.length + 1);
    if (active === pills.length) {
      // brief "complete" beat then loop
      pills.forEach(p => { p.classList.remove('scanning'); p.classList.add('done'); });
      setTimeout(() => { active = 0; tick(); }, 1200);
      return;
    }
  }
  tick();
  setInterval(tick, 2200);

  // Mini source-name churn between ticks for a "live" feel
  setInterval(() => {
    const pool = pools[Math.min(active, pools.length - 1)];
    srcEl.textContent = pool[Math.floor(Math.random() * pool.length)];
  }, 700);

  document.getElementById('cancel').addEventListener('click', () => {
    // Demo handler — in the real app this would return to InitialConfig
    alert('Would return to setup (InitialConfig).');
  });
</script>
</body>
</html>
