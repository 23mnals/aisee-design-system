<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dialog · AISEE Components</title><style>body{margin:0;background:#f7f8f7;color:#111;font-family:Karla,Arial,sans-serif}main{max-width:960px;margin:48px auto;padding:0 32px}h1{font-size:32px;font-weight:600;margin:0 0 8px}h2{font-size:18px;font-weight:600;margin-top:36px}.muted{color:#777}.surface{background:#eee;padding:32px 24px;border-radius:12px}.dialog{background:#fff;border:1px solid #e1e1e1;border-radius:16px;padding:24px;max-width:480px;margin:auto;box-shadow:0 8px 24px rgba(0,0,0,.1)}input{width:100%;box-sizing:border-box;height:40px;border:1px solid #e1e1e1;border-radius:8px;padding:0 12px}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.btn{border:0;border-radius:8px;padding:10px 18px;font:500 14px Karla;cursor:pointer}.confirm{background:#cfff29}.launch{margin-bottom:16px}.result{color:#777}</style></head><body><main><p class="muted">Components · Feedback & Overlays · Current</p><h1>Dialog</h1><p class="muted">A focused surface for collecting a short input before an action.</p><h2>Overview / Example</h2><button class="btn confirm launch">Open dialog</button><div class="surface"><div class="dialog"><h2 style="margin-top:0">Create analysis</h2><p class="muted">Add the website you want aisee to analyze.</p><input placeholder="https://example.com"><div class="actions"><button class="btn cancel">Cancel</button><button class="btn confirm">Confirm</button></div><p class="result" aria-live="polite"></p></div></div><h2>Specs</h2><p>Title Karla 20px / 600 · radius 16px · 32px internal breathing room.</p></main><script>const surface=document.querySelector('.surface');document.querySelector('.launch').onclick=()=>surface.scrollIntoView({behavior:'smooth'});document.querySelector('.cancel').onclick=()=>document.querySelector('.result').textContent='Cancelled';document.querySelector('.actions .confirm').onclick=()=>document.querySelector('.result').textContent='Analysis created';</script></body></html>
