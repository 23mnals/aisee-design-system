<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabs · AISEE Components</title><style>@font-face{font-family:Karla;src:url('../../fonts/Karla-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-display:swap}body{margin:0;background:#fafafa;color:#111;font-family:Karla,Arial,sans-serif}main{max-width:960px;margin:48px 0;padding:0 24px}h1{font-size:32px;font-weight:600;margin:0 0 8px}h2{font-size:18px;font-weight:600;margin-top:36px}.muted{color:rgba(17,17,17,.6)}.card{background:#fff;border:1px solid rgba(17,17,17,.05);border-radius:12px;padding:24px}.tabs{display:flex;gap:24px;border-bottom:1px solid rgba(17,17,17,.05)}.tab{position:relative;padding:8px 0;color:rgba(17,17,17,.6);border:0;background:none;cursor:pointer;font:500 14px Karla}.tab:after{position:absolute;right:0;bottom:-1px;left:0;height:2px;background:#111;content:"";opacity:0;transform:scaleX(.4);transition:opacity .25s,transform .25s cubic-bezier(.2,.8,.2,1)}.tab[aria-selected=true]{color:#111}.tab[aria-selected=true]:after{opacity:1;transform:scaleX(1)}.tab:focus-visible{outline:2px solid #111;outline-offset:3px;border-radius:2px}.panel{padding-top:16px}/* shared component content typography */ main > .muted:first-child,main > .meta:first-child,main > .eyebrow:first-child,.page .intro .eyebrow{display:none}main > h1,.page .intro h1{margin:0;font-size:16px;font-weight:500;line-height:24px}main > h1 + p,.page .intro h1 + p{margin-top:4px;font-size:12px;font-weight:400;line-height:18px}main h2{margin-top:32px;margin-bottom:8px;font-size:16px;font-weight:500;line-height:24px}main h2 + *{margin-top:8px!important}main .card > h2,main .panel > h2,main .surface > h2{margin:0 0 8px}main .name-row h2{margin:0;font-size:18px;font-weight:400;line-height:24px}/* shared component page frame */ body{width:100%;padding:24px!important;box-sizing:border-box}main,.page,#root{width:960px!important;max-width:100%!important;box-sizing:border-box;margin:0 auto!important;padding:0!important}main .card,main .panel,main .state-card,main figure,main .wrap,main .demo,main .gauge{border-color:rgba(17,17,17,.05)!important}</style></head><body><main><p class="muted">Components · Navigation · Current</p><h1>Tabs</h1><p class="muted">Switch between peer views without changing the surrounding page shell.</p><h2>Overview / Examples</h2><div class="card"><div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true" data-panel="Overview">Overview</button><button class="tab" role="tab" aria-selected="false" data-panel="Signal Feed">Signal Feed</button><button class="tab" role="tab" aria-selected="false" data-panel="Replies">Replies</button></div><div class="panel" aria-live="polite">Overview content</div></div><h2>States</h2><p>Active indicator is 2px solid black; inactive labels use 60% black.</p><h2>Specs</h2><p>Karla 14px / 500 · 8px vertical padding · 24px gap.</p></main><script>document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelector('.panel').textContent=b.dataset.panel+' content'}));</script></body></html>
