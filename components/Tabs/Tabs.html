<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tabs · AISEE Components</title><style>body{margin:0;background:#f7f8f7;color:#111;font-family:Karla,Arial,sans-serif}main{max-width:960px;margin:48px auto;padding:0 32px}h1{font-size:32px;font-weight:600;margin:0 0 8px}h2{font-size:18px;font-weight:600;margin-top:36px}.muted{color:#777}.card{background:#fff;border:1px solid #e1e1e1;border-radius:12px;padding:24px}.tabs{display:flex;gap:28px;border-bottom:1px solid #e1e1e1}.tab{padding:10px 0;color:#777;border:0;background:none;cursor:pointer;font:500 14px Karla}.tab.active{color:#111;border-bottom:2px solid #111}.panel{padding-top:16px}</style></head><body><main><p class="muted">Components · Navigation · Current</p><h1>Tabs</h1><p class="muted">Switch between peer views without changing the surrounding page shell.</p><h2>Overview / Examples</h2><div class="card"><div class="tabs" role="tablist"><button class="tab active" role="tab" aria-selected="true" data-panel="Overview">Overview</button><button class="tab" role="tab" aria-selected="false" data-panel="Signal Feed">Signal Feed</button><button class="tab" role="tab" aria-selected="false" data-panel="Replies">Replies</button></div><div class="panel" aria-live="polite">Overview content</div></div><h2>States</h2><p>Active indicator is 2px solid black; inactive labels use muted text.</p><h2>Specs</h2><p>Use Karla 14px / 500 with 24–32px horizontal rhythm.</p></main><script>document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-selected',x===b)});document.querySelector('.panel').textContent=b.dataset.panel+' content'}));</script></body></html>
