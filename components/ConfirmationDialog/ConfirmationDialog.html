<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Confirmation Dialog · AISEE Components</title><style>body{margin:0;background:#f7f8f7;color:#111;font-family:Karla,Arial,sans-serif}main{max-width:960px;margin:48px auto;padding:0 32px}h1{font-size:32px;font-weight:600;margin:0 0 8px}.muted{color:#777}.surface{background:#eee;padding:32px 24px;border-radius:12px}.dialog{background:#fff;border:1px solid #e1e1e1;border-radius:16px;padding:24px;max-width:480px;margin:auto;box-shadow:0 8px 24px rgba(0,0,0,.1)}.actions{display:flex;gap:12px;margin-top:24px}.btn{flex:1;border:0;border-radius:8px;padding:10px 18px;font:500 14px Karla;cursor:pointer}.danger{background:#ec5212;color:#fff}.subtle{background:#f5f5f5}.result{color:#777}</style></head><body><main><p class="muted">Components · Feedback & Overlays · Current</p><h1>Confirmation Dialog</h1><p class="muted">Use before destructive actions or when unsaved changes would be lost.</p><div class="surface"><div class="dialog"><h2 style="font-weight:600">Discard unsaved changes?</h2><p class="muted">Your changes will be lost if you leave this page.</p><div class="actions"><button class="btn subtle" id="keep">Keep Editing</button><button class="btn danger" id="discard">Discard Changes</button></div><p class="result" aria-live="polite"></p></div></div><h2>Specs</h2><p>Title Karla 20px / 600 · actions are full-width within the dialog.</p></main><script>const r=document.querySelector('.result');document.querySelector('#keep').onclick=()=>r.textContent='Changes kept';document.querySelector('#discard').onclick=()=>r.textContent='Changes discarded';</script></body></html>
