<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toggle · AISEE Components</title><style>@font-face{font-family:Karla;src:url('../../fonts/Karla-VariableFont_wght.ttf') format('truetype');font-weight:100 900;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#111;font-family:Karla,Arial,sans-serif}main{max-width:960px;margin:48px auto;padding:0 32px}h1{font-size:32px;font-weight:600;margin:0 0 8px}h2{font-size:18px;font-weight:600;margin-top:36px}.muted{color:rgba(17,17,17,.6)}.card{background:#fff;border:1px solid rgba(17,17,17,.05);border-radius:12px;padding:24px;max-width:420px}.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer}.toggle input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.track{position:relative;width:24px;height:16px;padding:2px;border:1px solid #111;border-radius:999px;background:rgba(17,17,17,.04);transition:background .15s}.knob{display:block;width:10px;height:10px;border-radius:50%;background:#111;transition:transform .15s cubic-bezier(.2,.8,.2,1)}.toggle input:checked+.track{background:#cfff29}.toggle input:checked+.track .knob{transform:translateX(8px)}.toggle input:focus-visible+.track{outline:2px solid #111;outline-offset:2px}.toggle:has(input:disabled){opacity:.5;cursor:not-allowed}</style></head><body><main><p class="muted">Components · Inputs &amp; Controls · Current</p><h1>Toggle</h1><p class="muted">A binary control for enabling or disabling monitoring and similar settings.</p><h2>Overview / Examples</h2><div class="card"><label class="toggle"><input type="checkbox" role="switch" checked><span class="track" aria-hidden="true"><span class="knob"></span></span><span class="label">Monitoring on</span></label></div><h2>States</h2><p>On and off states; disabled state follows the shared opacity rule.</p><h2>Specs</h2><p>Track 24×16px · thumb 10×10px · 1px black border · full radius.</p></main><script>const input=document.querySelector('.toggle input'),label=document.querySelector('.label');input.addEventListener('change',()=>{label.textContent=input.checked?'Monitoring on':'Monitoring off'});</script></body></html>
