<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tag · AISEE Components</title>
    <style>
      body { margin: 0; width: 100%; box-sizing: border-box; padding: 24px; background: #f7f8f7; color: #111; font-family: Karla, Arial, sans-serif; }
      main { width: 960px; max-width: 100%; box-sizing: border-box; margin: 0 auto; padding: 0; }
      h1 { margin: 0; font-size: 16px; font-weight: 500; line-height: 24px; }
      h2 { margin: 32px 0 8px; font-size: 16px; font-weight: 500; line-height: 24px; }
      .muted, .usage-copy { color: rgba(17,17,17,.6); font-size: 14px; line-height: 20px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      .tag { padding: 5px 10px; border-radius: 999px; font: 500 13px Karla, Arial, sans-serif; }
      .lime { background: #cfff29; }
      .black { background: #111; color: #fff; }
      .cream { background: #eff5c9; }
      .pink { background: #f4ddf6; }
      .blue { background: #dceeff; }
    </style>
  </head>
  <body>
    <main>
      <p class="muted">Components · Content &amp; Status · Legacy</p>
      <h1>Tag</h1>
      <p class="muted">Legacy contextual labels retained for historical reference.</p>
      <h2>Overview / Examples</h2>
      <div class="row">
        <span class="tag lime">Latest</span>
        <span class="tag black">Baseline</span>
        <span class="tag cream">Target</span>
        <span class="tag pink">Help-seeking</span>
        <span class="tag blue">Hot take</span>
      </div>
      <h2>Usage</h2>
      <p class="usage-copy">Keep labels short and use one semantic color per context.</p>
      <h2>Specs</h2>
      <p>Pill radius · Karla 13px / 500 · 8px horizontal gap.</p>
    </main>
  </body>
</html>
