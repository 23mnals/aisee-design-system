  <style>

    .topbar{z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 22px;border-bottom:1px solid var(--line);background:#fff}.brand-logo{display:block;width:142px;height:64px;object-fit:contain}.top-actions{display:flex;align-items:center;gap:18px;color:var(--muted)}.platform-link{font-size:13px;font-weight:500}.progress{display:flex;min-height:34px;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:10px}.progress-ring{width:18px;height:18px;border:3px solid #f1f1f1;border-top-color:var(--lime);border-radius:50%}.icon-button{display:grid;width:34px;height:34px;padding:0;border:0;border-radius:9px;place-items:center;background:#f7f7f7}.icon-button:focus-visible,.nav-item:focus-visible,.action:focus-visible{outline:2px solid #111;outline-offset:2px}

    .main{min-width:0;overflow:auto;padding:20px}.page{max-width:1500px;margin:0 auto;animation:page-in .18s var(--ease)}@keyframes page-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
    .banner{display:flex;min-height:72px;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:var(--banner,var(--lime-soft));box-shadow:0 0 0 5px #fff}.banner-icon{display:grid;width:44px;height:44px;flex:0 0 auto;border-radius:10px;place-items:center;background:#fff;box-shadow:0 1px 2px rgba(17,17,17,.06)}.banner-icon svg{width:22px;height:22px}.banner-copy{min-width:0}.banner-copy h1{margin:0;font-size:20px;font-weight:600;line-height:24px}.banner-copy p{margin:2px 0 0;color:var(--muted);font-size:12px}.banner-meta{display:flex;gap:22px;margin-left:auto}.banner-stat small{display:block;color:var(--muted);font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}.banner-stat strong{display:block;margin-top:2px;font-size:18px;line-height:20px}.action{min-height:36px;margin-left:auto;padding:7px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.04)}.action.primary{border-color:transparent;background:var(--accent,var(--lime))}.action.dark{border-color:#111;background:#111;color:#fff}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:24px 0 14px}.page-head h2{margin:0;font-size:18px;font-weight:600}.page-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.page-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}.page-tab{position:relative;padding:8px 0 10px;border:0;background:transparent;color:var(--muted);font-weight:500}.page-tab.active{color:#111;font-weight:600}.page-tab.active:after{position:absolute;right:0;bottom:-1px;left:0;height:2px;background:#111;content:""}

    .grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.panel{min-width:0;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.58)}.panel.warm{background:#fcfdf5}.panel.lavender{background:#fdf9fd}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.panel-head h3{margin:0;font-size:15px;font-weight:600}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:11px}.metric-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.metric-row:last-child{border:0}.metric-row strong{font-size:13px;font-weight:600}.metric-row small{color:var(--muted)}.score-box{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.score-flow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}.score-flow span{color:var(--muted);font-size:11px}.score-flow strong{display:block;margin-top:3px;font-size:27px}.arrow{color:#83c400;font-size:23px}.mini-chart{position:relative;height:70px;margin-top:10px;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(207,255,41,.16),transparent)}.mini-chart:before{position:absolute;right:8px;bottom:15px;left:8px;border-top:2px dashed var(--lime);transform:rotate(-11deg);content:""}.mini-chart:after{position:absolute;right:8px;top:11px;width:7px;height:7px;border:1px solid #111;border-radius:50%;background:var(--lime);content:""}
    .list{display:grid;gap:8px}.list-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;min-height:54px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.list-row strong{display:block;font-size:12px;font-weight:600}.list-row small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.list-action{min-height:30px;padding:5px 10px;border:0;border-radius:8px;background:var(--accent,var(--lime));font-size:11px;font-weight:500}.progress-line{height:5px;margin-top:7px;overflow:hidden;border-radius:999px;background:#eee}.progress-line span{display:block;height:100%;border-radius:inherit;background:var(--accent,var(--lime))}
    .feed-card{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.feed-card.selected{border-color:#111;outline:4px solid var(--yellow)}.feed-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px}.avatar{width:26px;height:26px;border-radius:50%;background:#111}.feed-card h3{margin:10px 0 5px;font-size:14px}.feed-card p{margin:0;color:var(--muted);font-size:11px}.feed-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:3px 7px;border-radius:999px;background:var(--cream);font-size:9px;font-weight:500}.tag.help{background:#fae2fe}.tag.hot{background:#dceeff}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.data-table{width:100%;border-collapse:collapse;white-space:nowrap}.data-table th,.data-table td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left}.data-table th{background:#f7f6f0;font-size:10px;font-weight:600}.data-table td{font-size:11px}.data-table tr:last-child td{border:0}

    .calendar{display:grid;grid-template-columns:repeat(7,minmax(68px,1fr));overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff}.cal-head,.cal-day{min-height:34px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cal-head{min-height:auto;background:#f7f6f0;color:var(--muted);font-size:9px;font-weight:600}.cal-day{min-height:80px;font-size:11px}.cal-day:nth-child(7n){border-right:0}.cal-day.active{background:var(--yellow-soft)}.event{display:block;margin-top:10px;padding:4px 6px;border-radius:5px;background:var(--yellow);font-size:9px}.event.engage{background:#fae2fe}
    .channel-grid,.media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.channel,.media-item{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff}.channel-top{display:flex;align-items:center;gap:9px}.channel-logo{display:grid;width:34px;height:34px;border-radius:50%;place-items:center;background:#111;color:#fff;font-size:11px;font-weight:600}.channel strong{font-size:12px}.channel small{display:block;color:var(--muted);font-size:10px}.channel .status-dot{margin-left:auto}.media-thumb{height:94px;border-radius:10px;background:linear-gradient(135deg,var(--cream),var(--yellow-soft));position:relative}.media-thumb:after{position:absolute;inset:24px;border:1px dashed rgba(17,17,17,.18);border-radius:8px;content:""}.media-item strong{display:block;margin-top:9px;font-size:11px}.media-item small{color:var(--muted);font-size:9px}.upload{display:grid;min-height:150px;border:1px dashed rgba(17,17,17,.22);border-radius:14px;place-items:center;background:#fff;text-align:center}.upload strong{display:block;font-size:13px}.upload small{color:var(--muted);font-size:10px}
    .loop{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.loop-step{position:relative;padding:14px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}.loop-step:after{position:absolute;top:50%;right:-9px;z-index:2;color:var(--muted);content:"→"}.loop-step:last-child:after{display:none}.loop-step small{color:var(--muted);font-size:9px}.loop-step strong{display:block;margin-top:5px;font-size:12px}.empty{display:grid;min-height:260px;place-items:center;text-align:center}.empty h3{margin:0;font-size:16px}.empty p{max-width:420px;margin:7px auto 14px;color:var(--muted);font-size:11px}
    @media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-3,.channel-grid,.media-grid{grid-template-columns:repeat(2,1fr)}.loop{grid-template-columns:repeat(3,1fr)}.loop-step:nth-child(3):after{display:none}.banner-meta{display:none}}
    @media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100vh}.top-actions .platform-link,.progress{display:none}.shell{display:block}.sidebar{display:none}.main{padding:14px}.banner{align-items:flex-start}.banner .action{display:none}.grid-2,.grid-3,.kpi-grid,.channel-grid,.media-grid,.loop{grid-template-columns:1fr}.loop-step:after{display:none}.calendar{grid-template-columns:repeat(7,minmax(46px,1fr))}.cal-day{min-height:62px;padding:6px}.brand-logo{width:118px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
  <div class="app">
    <header class="topbar"><img class="brand-logo" src="../../assets/aisee-logo-wordmark.svg" alt="aisee"><div class="top-actions" aria-label="Account controls"><span class="platform-link">X</span><span class="platform-link">in</span><span class="platform-link">Me</span><div class="progress"><i class="progress-ring"></i><strong>0% 0/89</strong></div><button class="icon-button" aria-label="Notifications" data-icon="bell"></button></div></header>
    <div class="shell">
      <aside class="sidebar"><div class="project"><img src="../../assets/aisee-logo-mark.png" alt=""><div><strong>aisee</strong><small>Last Updated: Aug 12, 2026</small></div></div><div class="sidebar-rule"></div><nav class="nav" id="navigation" aria-label="Product navigation"></nav><div class="account"><div class="account-card"><img src="../../assets/aisee-logo-mark.png" alt=""><div><strong>projects5@gmail.com</strong><small>Growth-Loop Plan</small></div></div><div class="credits"><strong>6840 Credits</strong><div class="credit-track"><span></span></div></div><button class="logout">Log out</button></div></aside>
      <main class="main"><div class="page" id="screen" aria-live="polite"></div></main>
    </div>
  </div>
  <script>
    const svg=(name)=>{const paths={bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M14 21h-4"/>',overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',analysis:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>',growth:'<path d="M4 18 9 12l4 3 7-9"/><path d="M15 6h5v5"/>',engage:'<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>',post:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',verify:'<path d="m4 12 5 5L20 6"/><circle cx="12" cy="12" r="10"/>',connection:'<path d="M8 12h8M12 8v8"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',media:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 20"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A8 8 0 0 0 15 6l-.3-2.6h-4L10.4 6A8 8 0 0 0 8.8 7L6.5 6l-2 3.4 2 1.5a7 7 0 0 0 0 2.2l-2 1.5 2 3.4 2.3-1A8 8 0 0 0 10.4 18l.3 2.6h4L15 18a8 8 0 0 0 1.6-1l2.3 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.overview}</svg>`};
    document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=svg(el.dataset.icon));
    const nav=[
      {group:'Project',items:[['Overview','overview']]},
      {group:'Growth Loop',items:[['Analysis','analysis'],['Growth','growth'],['Improve Score','growth',1],['Build Brand Influence','growth',1],['Engage','engage'],['Signal Feed','engage',1],['Keywords & Accounts','settings',1],['Replies','engage',1],['Post','post'],['Calendar','calendar',1],['Channels','connection',1],['Media','media',1],['Verify','verify'],['Connection','connection']]}
    ];
    const navigation=document.getElementById('navigation');navigation.innerHTML=nav.map(group=>`<p class="nav-label">${group.group}</p>${group.items.map(([label,icon,child])=>`${child?'<div class="nav-children">':''}<button class="nav-item" data-screen="${label}"><span class="nav-icon">${svg(icon)}</span>${label}</button>${child?'</div>':''}`).join('')}`).join('');
    const banner=(title,subtitle,color,icon='overview',right='')=>`<section class="banner" style="--banner:${color}"><div class="banner-icon">${svg(icon)}</div><div class="banner-copy"><h1>${title}</h1><p>${subtitle}</p></div>${right}</section>`;
    const kpis=(items)=>`<div class="kpi-grid">${items.map(([v,l,p])=>`<article class="kpi"><strong>${v}${p?`<span class="pill ${p[1]||''}">${p[0]}</span>`:''}</strong><small>${l}</small></article>`).join('')}</div>`;
    const head=(title,copy,action='')=>`<div class="page-head"><div><h2>${title}</h2><p>${copy}</p></div>${action}</div>`;
    const list=(items,accent='#cfff29')=>`<div class="list" style="--accent:${accent}">${items.map(([title,sub,value])=>`<article class="list-row"><div><strong>${title}</strong><small>${sub}</small>${value?`<div class="progress-line"><span style="width:${value}"></span></div>`:''}</div><button class="list-action">Open</button></article>`).join('')}</div>`;
    const screens={
      'Overview':()=>`${banner('Turn insights into measurable growth.','Track visibility, complete prioritized actions, and verify impact over time.','#e4efc1','overview','<button class="action">Open Today\'s Plan</button>')}${head('Overview','The current Growth Loop at a glance.')}${kpis([['68.3','AI visibility',['baseline']],['0 / 17','Score tasks completed'],['0 / 72','Brand influence tasks completed'],['6840','Available credits']])}<div class="grid-2"><section class="panel warm"><div class="panel-head"><h3>AI Visibility Score</h3></div><div class="score-box"><div class="score-flow"><div><span>Current</span><strong>68.3</strong></div><b class="arrow">→</b><div><span>7-day goal</span><strong>74.5</strong></div></div><div class="mini-chart"></div></div><div class="metric-row"><div><strong>Target outcome</strong><small>Top 3 recommended GEO / AEO platform</small></div><button class="action dark">View diagnosis</button></div></section><section class="panel"><div class="panel-head"><div><h3>Score Improvement Plan</h3><p>Top actions generated from the latest Analysis.</p></div><span class="pill soft">Score Growth</span></div>${list([['Expand Brand Lexicon and Schema','Brand · estimated lift +2.4','72%'],['Maintain Field Completeness','Coverage · estimated lift +4.8','46%'],['Build Stable Industry Recognition','Industry · estimated lift +2.8','31%']])}</section></div>`,
      'Analysis':()=>`${banner('Understand how AI platforms see your brand.','Run a diagnosis, compare model coverage and open historical reports.','#f5ffd4','analysis','<button class="action primary" style="--accent:#cfff29">New Analysis</button>')}${head('Analysis','Visibility, citation and prompt coverage across generative engines.')}${kpis([['68.3','AI visibility',['Latest','soft']],['9.4%','Citation score'],['42','Tracked prompts'],['5','AI platforms']])}<div class="grid-2"><section class="panel warm"><div class="panel-head"><div><h3>Visibility by platform</h3><p>Latest scan · Aug 12</p></div></div>${[['ChatGPT','82%'],['Perplexity','74%'],['Gemini','61%'],['Claude','58%']].map(x=>`<div class="metric-row"><strong>${x[0]}</strong><div style="width:48%"><small>${x[1]}</small><div class="progress-line"><span style="width:${x[1]};background:#cfff29"></span></div></div></div>`).join('')}</section><section class="panel"><div class="panel-head"><div><h3>Recent reports</h3><p>Reports remain attached to their original feature flow.</p></div></div>${list([['AI Presence Report','Completed · 5 platforms'],['Competitor Landscape','Completed · 8 competitors'],['Strategy Review','Ready for review']])}</section></div>`,

      'Replies':()=>`${banner('Replies','Review generated drafts and track sent response outcomes.','#f3e7f4','engage','<div class="banner-meta"><div class="banner-stat"><small>Awaiting</small><strong>3</strong></div><div class="banner-stat"><small>Sent</small><strong>8</strong></div><div class="banner-stat"><small>Replied</small><strong>2</strong></div></div>')}${head('Reply history','Sent and awaiting-review responses from all channels.')}<div class="page-tabs"><button class="page-tab active">Sent 8</button><button class="page-tab">Awaiting review 3</button></div><div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>Conversation</th><th>Channel</th><th>Status</th><th>Sent</th><th>Outcome</th></tr></thead><tbody>${[['GEO tools recommendation','X','Sent','Today 10:30','Author replied'],['AI visibility tracking','Reddit','Sent','Yesterday','3 upvotes'],['LLM citation reporting','X','Sent','Aug 11','Viewed'],['Best AEO platforms','Reddit','Sent','Aug 10','No response']].map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td><span class="pill lavender">${x[2]}</span></td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join('')}</tbody></table></div>`,
      'Post':()=>`${banner('Post','Plan, create and publish social content across connected channels.','#fffadd','post','<button class="action" style="background:#ffe253">New post</button>')}${head('Post workspace','Upcoming content, recent drafts and publishing status.')}${kpis([['24','Posts this month'],['6','Scheduled'],['14','Sent'],['4','Drafts']])}<div class="grid-2"><section class="panel"><div class="panel-head"><h3>Upcoming posts</h3><span class="pill yellow">This week</span></div>${list([['Why AI visibility matters','X · Today 8:20 AM'],['GEO diagnostic checklist','LinkedIn · Tomorrow'],['Track citations across LLMs','Reddit · Fri']],'#ffe253')}</section><section class="panel warm"><div class="panel-head"><h3>Quick composer</h3></div><div class="score-box"><small style="color:var(--muted)">Post to X, LinkedIn</small><p style="min-height:70px;margin:12px 0;color:var(--muted)">Start writing your post…</p><div class="feed-actions"><span class="pill yellow">280</span><button class="action" style="background:#ffe253">Continue</button></div></div></section></div>`,
      'Calendar':()=>`${banner('Content Calendar','Review scheduled and published content across all channels.','#fffadd','calendar','<button class="action" style="background:#ffe253">New post</button>')}${head('August 2026','12 scheduled posts across four channels.','<div class="chip-row"><button class="chip">Today</button><button class="chip active">Month</button></div>')}<div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${Array.from({length:35},(_,i)=>{const d=i+1;const e=[3,7,12,18,24,29].includes(d);return `<div class="cal-day ${d===12?'active':''}"><strong>${d}</strong>${e?`<span class="event ${d===18?'engage':''}">${d===18?'Engage reply':'Scheduled post'}</span>`:''}</div>`}).join('')}</div>`,

      'Media':()=>`${banner('Media Library','Reuse brand assets across planned and scheduled social content.','#fffadd','media','<button class="action" style="background:#ffe253">Upload media</button>')}${head('Media','24 files · 38.2 MB used.')}<div class="grid-2"><section class="upload"><div><strong>Drop files to upload</strong><small>PNG, JPG, GIF or MP4 up to 20 MB</small></div></section><section class="panel"><div class="panel-head"><h3>Asset usage</h3></div>${[['Used in scheduled posts','8'],['Unused assets','16'],['Storage remaining','81%']].map(x=>`<div class="metric-row"><strong>${x[0]}</strong><span class="pill yellow">${x[1]}</span></div>`).join('')}</section></div><div class="media-grid" style="margin-top:14px">${['geo-score-card.png','citation-report.png','brand-influence.mp4','prompt-strategy.png','ai-ranking.png','growth-loop.png'].map((x,i)=>`<article class="media-item"><div class="media-thumb" style="background:${i%2?'linear-gradient(135deg,#f3e7f4,#fff)':'linear-gradient(135deg,#f7f6e9,#fffadd)'}"></div><strong>${x}</strong><small>${i%2?'Video / social':'Image / report'}</small></article>`).join('')}</div>`,
      'Verify':()=>`${banner('Verify the impact','Compare before-and-after visibility and confirm which actions moved the score.','#f5ffd4','verify','<button class="action">Run verification</button>')}${head('Verification','Measurement closes the Growth Loop and feeds the next Analysis.')}${kpis([['+8.4','Visibility change'],['+12%','Citation lift'],['18','New mentions'],['5 / 5','Platforms checked']])}<div class="grid-2"><section class="panel warm"><div class="panel-head"><h3>Before vs after</h3><span class="pill soft">Aug 1–12</span></div><div class="score-box"><div class="score-flow"><div><span>Before</span><strong>59.9</strong></div><b class="arrow">→</b><div><span>After</span><strong>68.3</strong></div></div><div class="mini-chart"></div></div></section><section class="panel"><div class="panel-head"><h3>Verified outcomes</h3></div>${list([['Brand schema recognized','Confirmed on ChatGPT + Gemini'],['Citation coverage increased','12% lift across tracked prompts'],['Prompt strategy expanded','9 new recommendations']])}</section></div>`,
      'Connection':()=>`${banner('Connection','Manage the sources and destinations that power analysis and execution.','#f7f6e9','connection','<button class="action">Add connection</button>')}${head('Integrations','Keep publishing, content and analytics systems connected.')}<div class="grid-3">${[['Website','aisee.live','Connected'],['GitHub','aisee/product','Connected'],['Notion','Brand workspace','Connected'],['Google Docs','Content library','Connected'],['WordPress','Marketing site','Available'],['Analytics','GSC + GA4','Needs review']].map((x,i)=>`<article class="channel"><div class="channel-top"><span class="config-mark">${x[0].slice(0,2).toUpperCase()}</span><div><strong>${x[0]}</strong><small>${x[1]}</small></div><i class="status-dot" style="background:${i<4?'#a5d500':i===4?'#ddd':'#ffe253'}"></i></div><div class="metric-row"><small>${x[2]}</small><button class="action">Manage</button></div></article>`).join('')}</div><div class="panel" style="margin-top:14px"><div class="panel-head"><div><h3>Growth Loop data flow</h3><p>Connections support diagnosis, planning, execution and verification.</p></div></div><div class="loop">${[['Analysis','Diagnose'],['Growth','Prioritize'],['Engage','Respond'],['Post','Publish'],['Verify','Measure'],['Connection','Sync']].map(x=>`<div class="loop-step"><small>${x[1]}</small><strong>${x[0]}</strong></div>`).join('')}</div></div>`
    };
    const screen=document.getElementById('screen');
    const openScreen=(name,{updateHash=true}={})=>{const current=screens[name]?name:'Overview';screen.innerHTML=screens[current]();document.querySelectorAll('[data-screen]').forEach(x=>{const active=x.dataset.screen===current;x.classList.toggle('active',active);if(active)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});screen.dataset.current=current;document.title=`${current} · AISEE Web App UI Kit`;if(updateHash)history.replaceState(null,'',`#${encodeURIComponent(current)}`);document.querySelector('.main').scrollTo({top:0,behavior:'smooth'})};
    navigation.addEventListener('click',event=>{const item=event.target.closest('[data-screen]');if(item)openScreen(item.dataset.screen)});
    window.addEventListener('hashchange',()=>openScreen(decodeURIComponent(location.hash.slice(1)),{updateHash:false}));
    openScreen(decodeURIComponent(location.hash.slice(1))||'Overview',{updateHash:false});
  </script>
